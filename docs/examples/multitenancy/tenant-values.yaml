global:
  imagePullSecrets: [{name: nvcr-image-pull-secret}]
agentSandbox:
  install: false
llm:
  mode: external
  external:
    baseUrl: https://llm.example.com/v1
    model: served-model
    existingSecret: mosaic-inference
mosaicUi:
  auth:
    existingSecret: mosaic-ui-auth
modules:
  ui: {enabled: true}
  execution: {enabled: true}
  kubernetes: {enabled: true}
  observability: {enabled: false}
  grafana: {enabled: false}
  bcm: {enabled: false}
  slurm: {enabled: false}
  diagnostics: {enabled: false}
  research: {enabled: false}
  terminal: {enabled: false}
  clusters: {enabled: false}
  edit: {enabled: false}
bcmMcp:
  enabled: false
kubernetes:
  defaultCluster: tenant-a
  local:
    enabled: false
  clusters:
    - name: tenant-a
      kubeconfigSecretRef:
        name: tenant-a-kubeconfig
        key: config
