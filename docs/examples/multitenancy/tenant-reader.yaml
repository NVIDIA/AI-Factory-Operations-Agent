apiVersion: v1
kind: ServiceAccount
metadata:
  name: mosaic-job-reader
  namespace: tenant-a
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mosaic-job-reader
  namespace: tenant-a
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mosaic-job-reader
  namespace: tenant-a
subjects:
  - kind: ServiceAccount
    name: mosaic-job-reader
    namespace: tenant-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mosaic-job-reader
