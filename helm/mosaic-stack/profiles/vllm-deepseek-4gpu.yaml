# Four B200 GPUs on one node; Engram tables remain in GPU memory.
llm:
  mode: vllm
  requestCompatibility:
    reasoningEffort: ""
  modelOptions:
    reasoning: true
    maxTokens: 65536
    thinkingLevelMap: null
  vllm:
    profile: deepseek-4gpu
    name: vllm-deepseek
    image:
      repository: vllm/vllm-openai
      digest: sha256:298b8765981d9dabda0da1504487bcdca876d5c18e8533455b3fda65ae964ba2
    model: deepseek-ai/DeepSeek-V4.1-Flash-1017
    servedModelName: deepseek-v4.1-flash-1017
    gpuCount: 4
    tensorParallelSize: 4
    modelCache:
      size: 1Ti
    resources:
      requests:
        cpu: "64"
        memory: 512Gi
      limits:
        cpu: "128"
        memory: 1Ti
    chatTemplateKwargs:
      enable_thinking: false
      thinking: true
    extraEnv:
      - name: VLLM_USE_RUST_FRONTEND
        value: "1"
      - name: VLLM_ENGINE_READY_TIMEOUT_S
        value: "3600"
    extraArgs:
      - --revision=1bae0e1088993b9b82de08f59de5be5a34e42170
      - --tokenizer-mode=deepseek_v41
      - --reasoning-parser=deepseek_v41
      - --enable-auto-tool-choice
      - --tool-call-parser=deepseek_v41
      - --engram-config={"cpu_offload":false}
      - --attention-config={"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}
      - --kv-cache-dtype=fp8
      - --max-num-seqs=8
      - --max-num-batched-tokens=4096
      - --max-model-len=262144
      - --gpu-memory-utilization=0.90
openclaw:
  thinkingDefault: high
