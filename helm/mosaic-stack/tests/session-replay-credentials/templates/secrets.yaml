{{- $source := required "sourceNamespace is required" .Values.sourceNamespace -}}
{{- range .Values.secretNames }}
{{- $secret := lookup "v1" "Secret" $source . -}}
{{- if not $secret -}}
{{- fail (printf "Source secret %s/%s was not found" $source .) -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ . | quote }}
type: {{ $secret.type | quote }}
data:
  {{- $secret.data | toYaml | nindent 2 }}
{{- end }}
