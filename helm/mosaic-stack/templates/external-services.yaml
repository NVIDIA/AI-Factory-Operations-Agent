{{- if and .Values.modules.bcm.enabled .Values.externalServices.bcmMcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.externalServices.bcmMcp.name }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.externalServices.bcmMcp.externalName }}
  ports:
    - name: http
      port: {{ .Values.externalServices.bcmMcp.port }}
      targetPort: {{ .Values.externalServices.bcmMcp.port }}
{{- end }}
