{{ if and .Values.modules.ui.enabled .Values.mosaicUi.enabled .Values.mosaicUi.auth.create (not .Values.mosaicUi.auth.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.mosaicUi.auth.name -}}
{{- $password := "" -}}
{{- if $existing -}}
{{- $password = index $existing.data "password" | default "" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mosaicUi.auth.name }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.mosaicUi.auth.username | quote }}
  password: {{ .Values.mosaicUi.auth.password | default $password | default (randAlphaNum 32) | quote }}
{{- end }}
