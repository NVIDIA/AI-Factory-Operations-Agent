{{ $auth := .Values.mosaicUi.auth | default dict -}}
{{- $name := $auth.name | default "mosaic-ui-auth" -}}
{{ if and .Values.modules.ui.enabled .Values.mosaicUi.enabled (get $auth "create" | default true) (not $auth.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- $machineToken := "" -}}
{{- if $existing -}}
{{- $password = index $existing.data "password" | default "" | b64dec -}}
{{- $machineToken = index $existing.data "machineToken" | default "" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ $auth.username | default "operator" | quote }}
  password: {{ $auth.password | default $password | default (randAlphaNum 32) | quote }}
  machineToken: {{ $auth.machineToken | default $machineToken | default (randAlphaNum 48) | quote }}
{{- end }}
