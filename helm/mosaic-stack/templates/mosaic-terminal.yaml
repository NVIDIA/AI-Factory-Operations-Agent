{{- if .Values.modules.terminal.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mosaic-terminal
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-terminal
  labels:
    app: mosaic-terminal
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosaic-terminal
  template:
    metadata:
      labels:
        app: mosaic-terminal
      annotations:
        checksum/auth: {{ include (print $.Template.BasePath "/mosaic-terminal-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: mosaic-terminal
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" . | nindent 6 }}
      {{- include "mosaic-stack.tolerations" . | nindent 6 }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: openclaw
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-kubectl
          image: {{ include "mosaic-stack.image" .Values.openclaw.image | quote }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              case "$(uname -m)" in
                x86_64) architecture=amd64; sha={{ .Values.kubernetes.kubectlSha256.amd64 | quote }} ;;
                aarch64|arm64) architecture=arm64; sha={{ .Values.kubernetes.kubectlSha256.arm64 | quote }} ;;
                *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              curl -fsSL --retry 5 --retry-all-errors -o /tools/kubectl \
                "https://dl.k8s.io/release/{{ .Values.kubernetes.kubectlVersion }}/bin/linux/$architecture/kubectl"
              printf '%s  %s\n' "$sha" /tools/kubectl | sha256sum -c -
              chmod 0555 /tools/kubectl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tools
              mountPath: /tools
        - name: init-workspace
          image: {{ include "mosaic-stack.image" .Values.mosaicUi.image | quote }}
          imagePullPolicy: {{ .Values.mosaicUi.image.pullPolicy }}
          command: ["sh", "-c", "mkdir -p /home/node/.openclaw/workspace /home/node/.openclaw/tmp"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
      containers:
        - name: terminal
          image: {{ include "mosaic-stack.image" .Values.mosaicUi.image | quote }}
          imagePullPolicy: {{ .Values.mosaicUi.image.pullPolicy }}
          command: ["node", "/app/frontend/bin/mosaic-terminal.mjs"]
          ports:
            - name: http
              containerPort: {{ .Values.mosaicTerminal.service.port }}
          env:
            - name: HOME
              value: /home/node
            - name: PATH
              value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: MOSAIC_TERMINAL_PORT
              value: {{ .Values.mosaicTerminal.service.port | quote }}
            - name: MOSAIC_TERMINAL_IDLE_MS
              value: {{ .Values.mosaicTerminal.idleTimeoutMs | quote }}
            - name: MOSAIC_TERMINAL_WORKDIR
              value: /home/node/.openclaw/workspace
            - name: MOSAIC_TERMINAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.mosaicTerminal.auth.name .Values.mosaicTerminal.auth.existingSecret }}
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.mosaicTerminal.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tools
              mountPath: /tools
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: openclaw-home-pvc
        - name: tools
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mosaic-terminal
  labels:
    app: mosaic-terminal
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: mosaic-terminal
  ports:
    - name: http
      port: {{ .Values.mosaicTerminal.service.port }}
      targetPort: http
  type: ClusterIP
{{- end }}
