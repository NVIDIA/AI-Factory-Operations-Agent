{{- if and .Values.modules.terminal.enabled .Values.mosaicTerminal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-terminal
  labels:
    app: mosaic-terminal
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosaic-terminal
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mosaic-terminal
    spec:
      serviceAccountName: mosaic-terminal
      automountServiceAccountToken: true
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-kubectl
          image: {{ include "mosaic-stack.image" .Values.mosaicTerminal.kubectlInstallerImage | quote }}
          imagePullPolicy: {{ .Values.mosaicTerminal.kubectlInstallerImage.pullPolicy }}
          command: ["sh", "-lc", "set -eu; cp /usr/local/bin/kubectl /tools/kubectl && chmod +x /tools/kubectl"]
          volumeMounts:
            - name: tools
              mountPath: /tools
        - name: init-workspace
          image: {{ include "mosaic-stack.image" .Values.mosaicTerminal.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.mosaicTerminal.busyboxImage.pullPolicy }}
          command: ["sh", "-lc", "mkdir -p /home/node/.openclaw/workspace /home/node/.openclaw/tmp && chown -R 1000:1000 /home/node/.openclaw"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
      containers:
        - name: terminal
          image: {{ include "mosaic-stack.image" .Values.mosaicTerminal.image | quote }}
          imagePullPolicy: {{ .Values.mosaicTerminal.image.pullPolicy }}
          command: ["bash", "-lc", "set -euo pipefail; export PATH=/tools:$PATH; cd /home/node/.openclaw/workspace; exec sleep infinity"]
          env:
            - name: HOME
              value: /home/node
            - name: PATH
              value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tools
              mountPath: /tools
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: openclaw-home-pvc
        - name: tools
          emptyDir: {}
{{- end }}
