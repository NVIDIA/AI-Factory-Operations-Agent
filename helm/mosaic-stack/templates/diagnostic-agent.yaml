{{- if .Values.diagnosticAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-agent
  labels:
    app: diagnostic-agent
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: diagnostic-agent
  template:
    metadata:
      labels:
        app: diagnostic-agent
    spec:
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.diagnosticAgent.playbooksConfigMapName }}
      initContainers:
        - name: init-playbooks
          image: {{ include "mosaic-stack.image" .Values.diagnosticAgent.image | quote }}
          imagePullPolicy: {{ .Values.diagnosticAgent.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eux
              mkdir -p /opt/debuggability/playbooks
              tar xzf /opt/playbooks-tar/playbooks.tgz -C /opt/debuggability/playbooks
              python - <<'PY'
              from pathlib import Path
              import yaml

              root = Path("/opt/debuggability/playbooks")
              profile = {
                  "description": "Minimal dmesg collection for fast Mosaic hardware triage",
                  "nvdebug": {"command": "nvdebug collect -b {baseboard} -S H1", "level": "L1"},
                  "collectors": {
                      "host": [{"id": "H1", "name": "node_dmesg", "required": True}],
                  },
                  "expected_artifacts": ["dmesg.txt"],
                  "manual_fallback": {
                      "description": "If NVDebug is not installed:",
                      "commands": [
                          {"description": "Kernel messages", "command": "dmesg > dmesg.txt", "output": "dmesg.txt"},
                      ],
                      "packaging": "tar czf debug_bundle_dmesg_{bug_id}.tar.gz dmesg.txt 2>/dev/null",
                  },
              }

              targets = [root / "categories/general/unclassified.yaml"]
              targets.extend((root / "categories/gpu").glob("*.yaml"))
              for path in targets:
                  if not path.exists():
                      continue
                  data = yaml.safe_load(path.read_text()) or {}
                  profiles = data.setdefault("collection", {}).setdefault("profiles", {})
                  profiles["mosaic_h1_only"] = profile
                  path.write_text(yaml.safe_dump(data, sort_keys=False))
              PY
              ls /opt/debuggability/playbooks/categories/ | head
          volumeMounts:
            - name: playbooks
              mountPath: /opt/debuggability/playbooks
            - name: playbooks-tar
              mountPath: /opt/playbooks-tar
              readOnly: true
      {{- end }}
      containers:
        - name: diagnostic-agent
          image: {{ include "mosaic-stack.image" .Values.diagnosticAgent.image | quote }}
          imagePullPolicy: {{ .Values.diagnosticAgent.image.pullPolicy }}
          command: ["diagnostic-agent", "server", "--host=0.0.0.0", "--port=8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEBUGHUB_NVDEBUG__TIMEOUT_SECONDS
              value: {{ .Values.diagnosticAgent.config.nvdebugTimeoutSeconds | quote }}
            {{- if .Values.diagnosticAgent.hostSshKeySecretName }}
            - name: NVDEBUG_HOST_SSH_KEY_PATH
              value: /etc/ssh-keys/id_ecdsa
            - name: DEBUGHUB_NVDEBUG__HOST_SSH_KEY_PATH
              value: /etc/ssh-keys/id_ecdsa
            {{- end }}
            - name: DEBUGHUB_INFERENCE__ENDPOINT
              value: {{ .Values.global.vllmBaseUrl | quote }}
            - name: DEBUGHUB_INFERENCE__BACKEND
              value: {{ .Values.diagnosticAgent.config.inferenceBackend | quote }}
            - name: DEBUGHUB_INFERENCE__MODEL
              value: {{ .Values.global.vllmModel | quote }}
            - name: DEBUGHUB_INFERENCE__API_KEY
              value: {{ .Values.diagnosticAgent.config.inferenceApiKey | quote }}
            - name: DEBUGHUB_PLAYBOOK__PATH
              value: /opt/debuggability/playbooks
            - name: DEBUGHUB_PLAYBOOK_PATH
              value: /opt/debuggability/playbooks
            - name: BCM_WEBHOOK_TIMEOUT_SECONDS
              value: {{ .Values.diagnosticAgent.config.bcmWebhookTimeoutSeconds | quote }}
            - name: DEBUGHUB_BCM__WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.diagnosticAgent.bcmWebhookSecretName }}
                  key: BCM_WEBHOOK_URL
            - name: DEBUGHUB_BCM__WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.diagnosticAgent.bcmWebhookSecretName }}
                  key: BCM_WEBHOOK_TOKEN
            - name: DEBUGHUB_REASONING__REQUIRE_FINDINGS_MATCH
              value: {{ .Values.diagnosticAgent.config.reasoningRequireFindingsMatch | quote }}
            - name: MOSAIC_UI_URL
              value: {{ printf "http://mosaic-ui.%s.svc.cluster.local:3000" .Release.Namespace | quote }}
            - name: MOSAIC_ALERT_MIN_CONFIDENCE
              value: {{ .Values.diagnosticAgent.config.mosaicAlertMinConfidence | quote }}
            - name: DEBUGHUB_NVDEBUG__SPREADSHEET_PATH
              value: {{ .Values.diagnosticAgent.config.nvdebugSpreadsheetPath | quote }}
          envFrom:
            {{- range .Values.diagnosticAgent.existingSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
{{ toYaml .Values.diagnosticAgent.resources | indent 12 }}
          {{- if or .Values.diagnosticAgent.hostSshKeySecretName .Values.diagnosticAgent.playbooksConfigMapName }}
          volumeMounts:
            {{- if .Values.diagnosticAgent.hostSshKeySecretName }}
            - name: bcm-host-ssh-key
              mountPath: /etc/ssh-keys
              readOnly: true
            {{- end }}
            {{- if .Values.diagnosticAgent.playbooksConfigMapName }}
            - name: playbooks
              mountPath: /opt/debuggability/playbooks
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.diagnosticAgent.hostSshKeySecretName .Values.diagnosticAgent.playbooksConfigMapName }}
      volumes:
        {{- if .Values.diagnosticAgent.hostSshKeySecretName }}
        - name: bcm-host-ssh-key
          secret:
            secretName: {{ .Values.diagnosticAgent.hostSshKeySecretName }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.diagnosticAgent.playbooksConfigMapName }}
        - name: playbooks
          emptyDir: {}
        - name: playbooks-tar
          configMap:
            name: {{ .Values.diagnosticAgent.playbooksConfigMapName }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostic-agent
  labels:
    app: diagnostic-agent
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: diagnostic-agent
  ports:
    - name: http
      port: {{ .Values.diagnosticAgent.service.port }}
      targetPort: http
{{- end }}
