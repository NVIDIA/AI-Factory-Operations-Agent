{{- if and .Values.modules.diagnostics.enabled .Values.diagnosticAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-agent
  labels:
    app: diagnostic-agent
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: diagnostic-agent
  template:
    metadata:
      labels:
        app: diagnostic-agent
    spec:
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: init-nvdebug-wrapper
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              cat > /opt/mosaic-bin/nvdebug <<'EOF'
              #!/bin/sh
              if [ "${1:-}" = "collect" ]; then
                shift
                for arg in "$@"; do
                  if [ "$arg" = "--skip-zip-split" ] || [ "$arg" = "-Z" ]; then
                    exec /usr/local/bin/nvdebug collect "$@"
                  fi
                done
                exec /usr/local/bin/nvdebug collect --skip-zip-split "$@"
              fi
              exec /usr/local/bin/nvdebug "$@"
              EOF
              chmod 0755 /opt/mosaic-bin/nvdebug
          volumeMounts:
            - name: diagnostic-agent-bin
              mountPath: /opt/mosaic-bin
      {{- if .Values.diagnosticAgent.playbooksConfigMapName }}
        - name: init-playbooks
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eux
              mkdir -p /opt/debuggability/playbooks
              tar xzf /opt/playbooks-tar/playbooks.tgz -C /opt/debuggability/playbooks
              ls /opt/debuggability/playbooks/categories/ | head
          volumeMounts:
            - name: playbooks
              mountPath: /opt/debuggability/playbooks
            - name: playbooks-tar
              mountPath: /opt/playbooks-tar
              readOnly: true
      {{- end }}
      containers:
        - name: diagnostic-agent
          image: {{ include "mosaic-stack.image" .Values.diagnosticAgent.image | quote }}
          imagePullPolicy: {{ .Values.diagnosticAgent.image.pullPolicy }}
          command: ["diagnostic-agent", "server", "--host=0.0.0.0", "--port=8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEBUGHUB_NVDEBUG__TIMEOUT_SECONDS
              value: {{ .Values.diagnosticAgent.config.nvdebugTimeoutSeconds | quote }}
            - name: DEBUGHUB_NVDEBUG__PATH
              value: /opt/mosaic-bin/nvdebug
            {{- if .Values.diagnosticAgent.hostSshKeySecretName }}
            - name: NVDEBUG_HOST_SSH_KEY_PATH
              value: /etc/ssh-keys/id_ecdsa
            - name: DEBUGHUB_NVDEBUG__HOST_SSH_KEY_PATH
              value: /etc/ssh-keys/id_ecdsa
            {{- end }}
            - name: DEBUGHUB_INFERENCE__ENDPOINT
              value: {{ include "mosaic-stack.llmBaseUrl" . | quote }}
            - name: DEBUGHUB_INFERENCE__BACKEND
              value: {{ .Values.diagnosticAgent.config.inferenceBackend | quote }}
            - name: DEBUGHUB_INFERENCE__MODEL
              value: {{ include "mosaic-stack.llmModel" . | quote }}
            - name: DEBUGHUB_INFERENCE__API_KEY
              value: {{ .Values.diagnosticAgent.config.inferenceApiKey | quote }}
            - name: AGENT_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.diagnosticAgent.apiKeySecretName }}
                  key: AGENT_API_KEYS
            - name: DIAGNOSTIC_AGENT_AUTH_MODE
              value: required
            - name: DEBUGHUB_PLAYBOOK__PATH
              value: /opt/debuggability/playbooks
            - name: DEBUGHUB_PLAYBOOK_PATH
              value: /opt/debuggability/playbooks
            - name: BCM_WEBHOOK_TIMEOUT_SECONDS
              value: {{ .Values.diagnosticAgent.config.bcmWebhookTimeoutSeconds | quote }}
            - name: BCM_WEBHOOK_URL
              value: {{ printf "http://%s:%v" .Values.bcmMcp.service.name .Values.bcmMcp.service.port | quote }}
            - name: BCM_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.diagnosticAgent.apiKeySecretName }}
                  key: BCM_WEBHOOK_TOKEN
            - name: DEBUGHUB_REASONING__REQUIRE_FINDINGS_MATCH
              value: {{ .Values.diagnosticAgent.config.reasoningRequireFindingsMatch | quote }}
            - name: MOSAIC_UI_URL
              value: {{ printf "http://mosaic-ui.%s.svc.cluster.local:3000" .Release.Namespace | quote }}
            - name: MOSAIC_ALERT_MIN_CONFIDENCE
              value: {{ .Values.diagnosticAgent.config.mosaicAlertMinConfidence | quote }}
            - name: DEBUGHUB_NVDEBUG__SPREADSHEET_PATH
              value: {{ .Values.diagnosticAgent.config.nvdebugSpreadsheetPath | quote }}
          envFrom:
            {{- range .Values.diagnosticAgent.existingSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
{{ toYaml .Values.diagnosticAgent.resources | indent 12 }}
          volumeMounts:
            - name: diagnostic-agent-bin
              mountPath: /opt/mosaic-bin
            {{- if .Values.diagnosticAgent.hostSshKeySecretName }}
            - name: bcm-host-ssh-key
              mountPath: /etc/ssh-keys
              readOnly: true
            {{- end }}
            {{- if .Values.diagnosticAgent.playbooksConfigMapName }}
            - name: playbooks
              mountPath: /opt/debuggability/playbooks
              readOnly: true
            {{- end }}
      volumes:
        - name: diagnostic-agent-bin
          emptyDir: {}
        {{- if .Values.diagnosticAgent.hostSshKeySecretName }}
        - name: bcm-host-ssh-key
          secret:
            secretName: {{ .Values.diagnosticAgent.hostSshKeySecretName }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.diagnosticAgent.playbooksConfigMapName }}
        - name: playbooks
          emptyDir: {}
        - name: playbooks-tar
          configMap:
            name: {{ .Values.diagnosticAgent.playbooksConfigMapName }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostic-agent
  labels:
    app: diagnostic-agent
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: diagnostic-agent
  ports:
    - name: http
      port: {{ .Values.diagnosticAgent.service.port }}
      targetPort: http
{{- end }}
