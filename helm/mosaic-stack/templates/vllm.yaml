{{- $root := . -}}
{{- $v := .Values.llm.vllm -}}
{{- if eq .Values.llm.mode "vllm" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $v.name }}
  labels:
    app: {{ $v.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  serviceName: {{ $v.name }}-headless
  podManagementPolicy: Parallel
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      app: {{ $v.name }}
  template:
    metadata:
      labels:
        app: {{ $v.name }}
    spec:
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- with $v.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if $v.runtimeClassName }}
      runtimeClassName: {{ $v.runtimeClassName }}
      {{- end }}
      enableServiceLinks: false
      containers:
        - name: vllm
          image: {{ include "mosaic-stack.image" $v.image | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          command: ["vllm"]
          args:
            - serve
            - {{ $v.model | quote }}
            - --host=0.0.0.0
            - --port={{ $v.port }}
            - --tensor-parallel-size={{ include "mosaic-stack.vllmTensorParallelSize" . }}
            - --served-model-name={{ $v.servedModelName }}
            {{- range $v.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- if $v.existingSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $v.existingSecret }}
                  key: {{ $v.modelTokenSecretKey }}
                  optional: true
            {{- end }}
            - name: HF_HOME
              value: /models
            - name: HUGGINGFACE_HUB_CACHE
              value: /models
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: NCCL_NVLS_ENABLE
              value: "0"
            - name: VLLM_ALLREDUCE_USE_SYMM_MEM
              value: "0"
          ports:
            - name: http
              containerPort: {{ $v.port }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 480
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 40
          resources:
            requests:
{{ toYaml $v.resources.requests | indent 14 }}
              nvidia.com/gpu: {{ $v.gpuCount | quote }}
            limits:
{{ toYaml $v.resources.limits | indent 14 }}
              nvidia.com/gpu: {{ $v.gpuCount | quote }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $v.shmSize }}
  volumeClaimTemplates:
    - metadata:
        name: model-cache
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $v.modelCache.size }}
        {{- if $v.modelCache.storageClassName }}
        storageClassName: {{ $v.modelCache.storageClassName | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}
  labels:
    app: {{ $v.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ $v.name }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}-headless
  labels:
    app: {{ $v.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ $v.name }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: http
{{- end }}
{{- if and (eq $root.Values.llm.mode "vllm") $v.compatibilityService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.compatibilityService.name }}
  namespace: {{ $v.compatibilityService.namespace }}
  labels:
    app: {{ $v.compatibilityService.name }}
    {{- include "mosaic-stack.labels" $root | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ default (printf "%s.%s.svc.cluster.local" $v.name $root.Release.Namespace) $v.compatibilityService.externalName }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: {{ $v.port }}
{{- end }}
