{{- $root := . -}}
{{- $v := .Values.llm.vllm -}}
{{- $distributed := and (eq .Values.llm.mode "vllm") (eq (toString $v.distributed.enabled) "true") -}}
{{- if eq .Values.llm.mode "vllm" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $v.name }}
  labels:
    app: {{ $v.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  serviceName: {{ $v.name }}-headless
  podManagementPolicy: Parallel
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      app: {{ $v.name }}
  template:
    metadata:
      labels:
        app: {{ $v.name }}
        role: {{ ternary "head" "server" $distributed }}
    spec:
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- with $v.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if $v.runtimeClassName }}
      runtimeClassName: {{ $v.runtimeClassName }}
      {{- end }}
      enableServiceLinks: false
      containers:
        - name: vllm
          image: {{ include "mosaic-stack.image" $v.image | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          {{- if $distributed }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ray start --head --port={{ $v.distributed.rayPort }} --dashboard-host=0.0.0.0 --num-gpus={{ $v.gpuCount }}
              export RAY_ADDRESS=127.0.0.1:{{ $v.distributed.rayPort }}
              python3 - <<'PY'
              import os, time
              import ray
              target = int(os.environ["VLLM_RAY_EXPECTED_GPUS"])
              ray.init(address=os.environ["RAY_ADDRESS"], ignore_reinit_error=True)
              for _ in range(360):
                  gpus = int(ray.cluster_resources().get("GPU", 0))
                  if gpus >= target:
                      print(f"Ray GPU resources ready: {gpus}")
                      break
                  print(f"Waiting for Ray GPU resources: {gpus}/{target}", flush=True)
                  time.sleep(5)
              else:
                  raise SystemExit(f"Ray cluster never reached {target} GPUs")
              PY
              args=(serve {{ $v.model | quote }} --host=0.0.0.0 --port={{ $v.port }} --tensor-parallel-size={{ include "mosaic-stack.vllmTensorParallelSize" . }} --distributed-executor-backend=ray --served-model-name={{ $v.servedModelName | quote }})
              {{- range $v.extraArgs }}
              args+=({{ . | quote }})
              {{- end }}
              exec vllm "${args[@]}"
          {{- else }}
          command: ["vllm"]
          args:
            - serve
            - {{ $v.model | quote }}
            - --host=0.0.0.0
            - --port={{ $v.port }}
            - --tensor-parallel-size={{ include "mosaic-stack.vllmTensorParallelSize" . }}
            - --served-model-name={{ $v.servedModelName }}
            {{- range $v.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            {{- if $v.existingSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $v.existingSecret }}
                  key: {{ $v.modelTokenSecretKey }}
                  optional: true
            {{- end }}
            - name: HF_HOME
              value: /models
            - name: HUGGINGFACE_HUB_CACHE
              value: /models
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: NCCL_NVLS_ENABLE
              value: "0"
            - name: VLLM_ALLREDUCE_USE_SYMM_MEM
              value: "0"
            {{- if $distributed }}
            - name: VLLM_RAY_EXPECTED_GPUS
              value: {{ $v.distributed.expectedGpuCount | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $v.port }}
            {{- if $distributed }}
            - name: ray
              containerPort: {{ $v.distributed.rayPort }}
            - name: dashboard
              containerPort: {{ $v.distributed.dashboardPort }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 480
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 40
          resources:
            requests:
{{ toYaml $v.resources.requests | indent 14 }}
              nvidia.com/gpu: {{ $v.gpuCount | quote }}
            limits:
{{ toYaml $v.resources.limits | indent 14 }}
              nvidia.com/gpu: {{ $v.gpuCount | quote }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $v.shmSize }}
  volumeClaimTemplates:
    - metadata:
        name: model-cache
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $v.modelCache.size }}
        {{- if $v.modelCache.storageClassName }}
        storageClassName: {{ $v.modelCache.storageClassName | quote }}
        {{- end }}
{{- if $distributed }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $v.name }}-worker
  labels:
    app: {{ $v.name }}-worker
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  serviceName: {{ $v.name }}-worker-headless
  podManagementPolicy: Parallel
  replicas: {{ $v.distributed.workerReplicaCount }}
  selector:
    matchLabels:
      app: {{ $v.name }}-worker
      app.kubernetes.io/component: ray-worker
      role: worker
  template:
    metadata:
      labels:
        app: {{ $v.name }}-worker
        app.kubernetes.io/component: ray-worker
        role: worker
    spec:
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- with $v.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if $v.runtimeClassName }}
      runtimeClassName: {{ $v.runtimeClassName }}
      {{- end }}
      enableServiceLinks: false
      containers:
        - name: ray-worker
          image: {{ include "mosaic-stack.image" $v.image | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              until ray start --address={{ $v.name }}-ray-head:{{ $v.distributed.rayPort }} --num-gpus={{ $v.distributed.workerGpuCount }} --block; do
                sleep 5
              done
          env:
            {{- if $v.existingSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $v.existingSecret }}
                  key: {{ $v.modelTokenSecretKey }}
                  optional: true
            {{- end }}
            - name: HF_HOME
              value: /models
            - name: HUGGINGFACE_HUB_CACHE
              value: /models
            - name: NCCL_NVLS_ENABLE
              value: "0"
            - name: VLLM_ALLREDUCE_USE_SYMM_MEM
              value: "0"
          resources:
            requests:
{{ toYaml $v.resources.requests | indent 14 }}
              nvidia.com/gpu: {{ $v.distributed.workerGpuCount | quote }}
            limits:
{{ toYaml $v.resources.limits | indent 14 }}
              nvidia.com/gpu: {{ $v.distributed.workerGpuCount | quote }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $v.shmSize }}
  volumeClaimTemplates:
    - metadata:
        name: model-cache
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $v.modelCache.size }}
        {{- if $v.modelCache.storageClassName }}
        storageClassName: {{ $v.modelCache.storageClassName | quote }}
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}
  labels:
    app: {{ $v.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ $v.name }}
    role: {{ ternary "head" "server" $distributed }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}-headless
  labels:
    app: {{ $v.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ $v.name }}
    role: {{ ternary "head" "server" $distributed }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: http
{{- if $distributed }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}-ray-head
  labels:
    app: {{ $v.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  publishNotReadyAddresses: true
  selector:
    app: {{ $v.name }}
    role: head
  ports:
    - name: ray
      port: {{ $v.distributed.rayPort }}
      targetPort: ray
    - name: dashboard
      port: {{ $v.distributed.dashboardPort }}
      targetPort: dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.name }}-worker-headless
  labels:
    app: {{ $v.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ $v.name }}-worker
    role: worker
  ports:
    - name: ray
      port: {{ $v.distributed.rayPort }}
      targetPort: {{ $v.distributed.rayPort }}
{{- end }}
{{- end }}
{{- if and (eq $root.Values.llm.mode "vllm") $v.compatibilityService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.compatibilityService.name }}
  namespace: {{ $v.compatibilityService.namespace }}
  labels:
    app: {{ $v.compatibilityService.name }}
    {{- include "mosaic-stack.labels" $root | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ default (printf "%s.%s.svc.cluster.local" $v.name $root.Release.Namespace) $v.compatibilityService.externalName }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: {{ $v.port }}
{{- end }}
{{- if and (eq $root.Values.llm.mode "vllm") $v.requestCompatibility.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $v.requestCompatibility.name }}
  labels:
    app: {{ $v.requestCompatibility.name }}
    {{- include "mosaic-stack.labels" $root | nindent 4 }}
data:
  server.js: |
    const http = require('http');
    const upstream = new URL(process.env.UPSTREAM_ORIGIN || 'http://{{ $v.name }}:{{ $v.port }}');
    const port = Number(process.env.PORT || {{ $v.requestCompatibility.port }});
    const disableThinking = process.env.DISABLE_THINKING === 'true';

    function readBody(req) {
      return new Promise((resolve, reject) => {
        const chunks = [];
        req.on('data', chunk => chunks.push(chunk));
        req.on('end', () => resolve(Buffer.concat(chunks)));
        req.on('error', reject);
      });
    }

    function patchBody(req, body) {
      if (!disableThinking || req.method !== 'POST' || !req.url.endsWith('/chat/completions')) return body;
      try {
        const json = JSON.parse(body.toString('utf8'));
        json.chat_template_kwargs = { ...(json.chat_template_kwargs || {}), enable_thinking: false };
        return Buffer.from(JSON.stringify(json));
      } catch {
        return body;
      }
    }

    http.createServer(async (req, res) => {
      if (req.url === '/health') return res.writeHead(200).end('ok');
      const body = patchBody(req, await readBody(req));
      const target = new URL(req.url, upstream);
      const headers = { ...req.headers, host: upstream.host, 'content-length': String(body.length) };
      const out = http.request(target, { method: req.method, headers }, upstreamRes => {
        res.writeHead(upstreamRes.statusCode || 502, upstreamRes.headers);
        upstreamRes.pipe(res);
      });
      out.on('error', error => {
        res.writeHead(502, { 'content-type': 'application/json' });
        res.end(JSON.stringify({ error: String(error.message || error) }));
      });
      out.end(body);
    }).listen(port, '0.0.0.0');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $v.requestCompatibility.name }}
  labels:
    app: {{ $v.requestCompatibility.name }}
    {{- include "mosaic-stack.labels" $root | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $v.requestCompatibility.name }}
  template:
    metadata:
      labels:
        app: {{ $v.requestCompatibility.name }}
      annotations:
        checksum/config: {{ printf "%s-%v" $v.requestCompatibility.name $v.requestCompatibility.disableThinking | sha256sum }}
    spec:
      {{- include "mosaic-stack.imagePullSecrets" $root | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" $root | nindent 6 }}
      containers:
        - name: proxy
          image: {{ include "mosaic-stack.image" $root.Values.mosaicUi.image | quote }}
          imagePullPolicy: {{ $root.Values.mosaicUi.image.pullPolicy }}
          command: ["node", "/config/server.js"]
          env:
            - name: PORT
              value: {{ $v.requestCompatibility.port | quote }}
            - name: UPSTREAM_ORIGIN
              value: {{ printf "http://%s:%v" $v.name $v.port | quote }}
            - name: DISABLE_THINKING
              value: {{ ternary "true" "false" $v.requestCompatibility.disableThinking | quote }}
          ports:
            - name: http
              containerPort: {{ $v.requestCompatibility.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $v.requestCompatibility.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.requestCompatibility.name }}
  labels:
    app: {{ $v.requestCompatibility.name }}
    {{- include "mosaic-stack.labels" $root | nindent 4 }}
spec:
  selector:
    app: {{ $v.requestCompatibility.name }}
  ports:
    - name: http
      port: {{ $v.requestCompatibility.port }}
      targetPort: http
{{- end }}
