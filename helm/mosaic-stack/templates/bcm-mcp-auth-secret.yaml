{{ if and .Values.modules.bcm.enabled .Values.bcmMcp.enabled (eq .Values.bcmMcp.mode "ssh-adapter") .Values.bcmMcp.authTokenCreate -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.bcmMcp.authTokenSecretName -}}
{{- $existingToken := "" -}}
{{- if $existing -}}
{{- $existingToken = index $existing.data .Values.bcmMcp.authTokenSecretKey | default "" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bcmMcp.authTokenSecretName }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.bcmMcp.authTokenSecretKey }}: {{ .Values.bcmMcp.authToken | default $existingToken | default (randAlphaNum 48) | quote }}
{{- end }}
