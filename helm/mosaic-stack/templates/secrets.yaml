{{ if and .Values.modules.execution.enabled .Values.openclaw.enabled .Values.openclaw.secrets.create }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace .Values.openclaw.secrets.name -}}
{{- $existingToken := "" -}}
{{- if and $existingSecret (hasKey $existingSecret.data "OPENCLAW_GATEWAY_TOKEN") -}}
{{- $existingToken = (index $existingSecret.data "OPENCLAW_GATEWAY_TOKEN" | b64dec) -}}
{{- end -}}
{{- $gatewayToken := .Values.openclaw.secrets.gatewayToken | default $existingToken | default (randAlphaNum 48) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.openclaw.secrets.name }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ $gatewayToken | quote }}
---
{{- end }}
{{ if and .Values.modules.diagnostics.enabled .Values.diagnosticAgent.enabled }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace .Values.diagnosticAgent.apiKeySecretName -}}
{{- $existingApiKey := "" -}}
{{- $existingBcmKey := "" -}}
{{- if and $existingSecret (hasKey $existingSecret.data "API_KEY") -}}
{{- $existingApiKey = (index $existingSecret.data "API_KEY" | b64dec) -}}
{{- end -}}
{{- if and $existingSecret (hasKey $existingSecret.data "BCM_WEBHOOK_TOKEN") -}}
{{- $existingBcmKey = (index $existingSecret.data "BCM_WEBHOOK_TOKEN" | b64dec) -}}
{{- end -}}
{{- $apiKey := $existingApiKey | default (randAlphaNum 48) -}}
{{- $bcmKey := $existingBcmKey | default (randAlphaNum 48) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.diagnosticAgent.apiKeySecretName }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ $apiKey | quote }}
  AGENT_API_KEYS: {{ dict "openclaw" $apiKey | toJson | quote }}
  BCM_WEBHOOK_TOKEN: {{ $bcmKey | quote }}
---
{{- end }}
{{ if and .Values.modules.research.enabled .Values.modules.research.secrets.create }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace .Values.researchAgent.iraop.secretName -}}
{{- $existingApiKey := "" -}}
{{- if and $existingSecret (hasKey $existingSecret.data "IRAOP_API_KEY") -}}
{{- $existingApiKey = (index $existingSecret.data "IRAOP_API_KEY" | b64dec) -}}
{{- end -}}
{{- $apiKey := $existingApiKey | default (randAlphaNum 48) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.researchAgent.iraop.secretName }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  NVIDIA_API_KEY: {{ .Values.modules.research.secrets.nvidiaApiKey | quote }}
  NVIDIA_CHAT_API_KEY: {{ .Values.modules.research.secrets.chatApiKey | quote }}
  IRAOP_API_KEY: {{ $apiKey | quote }}
---
{{- end }}
