{{- if .Values.registryCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registryCredentials.name }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict .Values.registryCredentials.server (dict "username" .Values.registryCredentials.username "password" .Values.registryCredentials.password "email" .Values.registryCredentials.email "auth" (printf "%s:%s" .Values.registryCredentials.username .Values.registryCredentials.password | b64enc))) | toJson | quote }}
---
{{- end }}
{{- if and (eq .Values.llm.mode "vllm") .Values.llm.vllm.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.llm.vllm.existingSecret }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.llm.vllm.modelTokenSecretKey }}: {{ .Values.llm.vllm.secrets.hfToken | quote }}
---
{{- end }}
{{- if and .Values.modules.execution.enabled .Values.openclaw.enabled .Values.openclaw.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.openclaw.secrets.name }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.openclaw.secrets.gatewayToken | quote }}
---
{{- end }}
