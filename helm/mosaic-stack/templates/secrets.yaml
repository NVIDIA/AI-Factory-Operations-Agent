{{ if and .Values.modules.execution.enabled .Values.openclaw.enabled .Values.openclaw.secrets.create }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace .Values.openclaw.secrets.name -}}
{{- $existingToken := "" -}}
{{- if and $existingSecret (hasKey $existingSecret.data "OPENCLAW_GATEWAY_TOKEN") -}}
{{- $existingToken = (index $existingSecret.data "OPENCLAW_GATEWAY_TOKEN" | b64dec) -}}
{{- end -}}
{{- $gatewayToken := .Values.openclaw.secrets.gatewayToken | default $existingToken | default (randAlphaNum 48) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.openclaw.secrets.name }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ $gatewayToken | quote }}
---
{{- end }}
{{ if and .Values.modules.research.enabled .Values.modules.research.managed .Values.modules.research.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.researchAgent.iraop.secretName }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  NVIDIA_API_KEY: {{ .Values.modules.research.secrets.nvidiaApiKey | quote }}
  NVIDIA_CHAT_API_KEY: {{ .Values.modules.research.secrets.chatApiKey | quote }}
---
{{- end }}
{{ if and .Values.modules.diagnostics.enabled .Values.diagnosticAgent.enabled .Values.diagnosticAgent.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: diagnostic-agent-api-keys
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENT_API_KEYS: {{ .Values.diagnosticAgent.secrets.apiKeys | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.diagnosticAgent.bcmWebhookSecretName }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  BCM_WEBHOOK_URL: {{ .Values.diagnosticAgent.secrets.bcmWebhookUrl | quote }}
  BCM_WEBHOOK_TOKEN: {{ .Values.diagnosticAgent.secrets.bcmWebhookToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: diagnostic-agent-secrets
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.diagnosticAgent.secrets.env }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.diagnosticAgent.hostSshKeySecretName }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  id_ecdsa: {{ .Values.diagnosticAgent.secrets.hostSshPrivateKey | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.diagnosticAgent.playbooksConfigMapName }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
binaryData:
  playbooks.tgz: {{ .Values.diagnosticAgent.secrets.playbooksTgzBase64 | quote }}
{{- end }}
