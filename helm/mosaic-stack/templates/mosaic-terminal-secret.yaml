{{ if and .Values.modules.terminal.enabled .Values.mosaicTerminal.auth.create (not .Values.mosaicTerminal.auth.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.mosaicTerminal.auth.name -}}
{{- $existingToken := "" -}}
{{- if and $existing (hasKey $existing.data "token") -}}
{{- $existingToken = (index $existing.data "token" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mosaicTerminal.auth.name }}
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.mosaicTerminal.auth.token | default $existingToken | default (randAlphaNum 48) | quote }}
{{- end }}
