{{- if not (has .Values.llm.mode (list "external" "vllm")) -}}
{{- fail "llm.mode must be one of: external, vllm" -}}
{{- end -}}
{{- if not (has .Values.modules.slurm.backend (list "auto" "vanilla" "bcm")) -}}
{{- fail "modules.slurm.backend must be one of: auto, vanilla, bcm" -}}
{{- end -}}
{{- if and .Values.modules.slurm.enabled (eq .Values.modules.slurm.backend "bcm") (ne (include "mosaic-stack.bcmEnabled" .) "true") -}}
{{- fail "modules.slurm.backend=bcm requires an enabled BCM MCP service" -}}
{{- end -}}
{{- if and (eq (include "mosaic-stack.slurmBcmEnabled" .) "true") (ne .Values.bcmMcp.mode "ssh-adapter") -}}
{{- fail "BCM Slurm evidence requires bcmMcp.mode=ssh-adapter" -}}
{{- end -}}
{{- if and .Values.modules.slurm.enabled (eq (include "mosaic-stack.slurmBcmEnabled" .) "true") .Values.bcmMcp.enabled .Values.bcmMcp.config.noCmshUser -}}
{{- fail "BCM-backed Slurm evidence requires bcmMcp.config.noCmshUser=false" -}}
{{- end -}}
{{- if and .Values.modules.slurm.enabled (ne (include "mosaic-stack.slurmBcmEnabled" .) "true") (not .Values.modules.slurm.evidenceCollector.enabled) -}}
{{- fail "vanilla Slurm requires modules.slurm.evidenceCollector.enabled=true" -}}
{{- end -}}
{{- if eq .Values.llm.mode "external" -}}
{{- if not .Values.llm.external.baseUrl -}}
{{- fail "llm.external.baseUrl is required when llm.mode=external" -}}
{{- end -}}
{{- if not .Values.llm.external.model -}}
{{- fail "llm.external.model is required when llm.mode=external" -}}
{{- end -}}
{{- end -}}
{{- if eq .Values.llm.mode "vllm" -}}
{{- if not (has .Values.llm.vllm.profile (list "super-1gpu" "ultra-16gpu")) -}}
{{- fail "llm.vllm.profile must be one of: super-1gpu, ultra-16gpu" -}}
{{- end -}}
{{- if lt (int .Values.llm.vllm.gpuCount) 1 -}}
{{- fail "llm.vllm.gpuCount must be at least 1" -}}
{{- end -}}
{{- if lt (int .Values.llm.vllm.replicaCount) 1 -}}
{{- fail "llm.vllm.replicaCount must be at least 1" -}}
{{- end -}}
{{- if and (eq (toString .Values.llm.vllm.distributed.enabled) "true") (ne (int .Values.llm.vllm.replicaCount) 1) -}}
{{- fail "llm.vllm.replicaCount must be 1 when distributed vLLM is enabled" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.global.registryCredentials.create (not .Values.global.registryCredentials.password) -}}
{{- fail "global.registryCredentials.password is required when global.registryCredentials.create=true" -}}
{{- end -}}
{{- if and .Values.bcmMcp.enabled (eq .Values.bcmMcp.mode "ssh-adapter") (not .Values.bcmMcp.headHost) -}}
{{- fail "bcmMcp.headHost is required when bcmMcp.mode=ssh-adapter" -}}
{{- end -}}
{{- if and .Values.bcmMcp.enabled (eq .Values.bcmMcp.mode "ssh-adapter") (not .Values.bcmMcp.hostSshKeySecretName) -}}
{{- fail "bcmMcp.hostSshKeySecretName is required when bcmMcp.mode=ssh-adapter" -}}
{{- end -}}
{{- if and .Values.modules.research.managed (not .Values.modules.research.enabled) -}}
{{- fail "modules.research.managed=true requires modules.research.enabled=true" -}}
{{- end -}}
{{- if and .Values.modules.research.managed .Values.modules.research.secrets.create (not .Values.modules.research.secrets.nvidiaApiKey) -}}
{{- fail "modules.research.secrets.nvidiaApiKey is required when the managed Research Agent Secret is created" -}}
{{- end -}}
{{- if and .Values.modules.diagnostics.enabled (not .Values.diagnosticAgent.enabled) -}}
{{- fail "modules.diagnostics.enabled=true requires diagnosticAgent.enabled=true" -}}
{{- end -}}
{{- if and .Values.modules.diagnostics.enabled .Values.diagnosticAgent.secrets.create (not .Values.diagnosticAgent.secrets.apiKeys) -}}
{{- fail "diagnosticAgent.secrets.apiKeys is required when Hardware Agent Secrets are created" -}}
{{- end -}}
{{- if and .Values.modules.diagnostics.enabled .Values.diagnosticAgent.secrets.create (not .Values.diagnosticAgent.secrets.hostSshPrivateKey) -}}
{{- fail "diagnosticAgent.secrets.hostSshPrivateKey is required when Hardware Agent Secrets are created" -}}
{{- end -}}
{{- if and .Values.modules.diagnostics.enabled .Values.diagnosticAgent.secrets.create (not .Values.diagnosticAgent.secrets.playbooksTgzBase64) -}}
{{- fail "diagnosticAgent.secrets.playbooksTgzBase64 is required when Hardware Agent Secrets are created" -}}
{{- end -}}
{{- if and .Values.modules.diagnostics.enabled .Values.diagnosticAgent.secrets.create (not .Values.diagnosticAgent.secrets.bcmWebhookUrl) -}}
{{- fail "diagnosticAgent.secrets.bcmWebhookUrl is required when Hardware Agent Secrets are created" -}}
{{- end -}}
{{- if and .Values.modules.diagnostics.enabled .Values.diagnosticAgent.secrets.create (not .Values.diagnosticAgent.secrets.bcmWebhookToken) -}}
{{- fail "diagnosticAgent.secrets.bcmWebhookToken is required when Hardware Agent Secrets are created" -}}
{{- end -}}
