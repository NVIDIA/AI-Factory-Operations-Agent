{{- if .Values.namespace.labels }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mosaic-stack.fullname" . }}-namespace-labels
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-namespace-labels
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ .Release.Namespace | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-namespace-labels
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-namespace-labels
subjects:
  - kind: ServiceAccount
    name: {{ include "mosaic-stack.fullname" . }}-namespace-labels
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mosaic-stack.fullname" . }}-namespace-labels
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: {{ include "mosaic-stack.fullname" . }}-namespace-labels
      restartPolicy: OnFailure
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: label
          image: {{ include "mosaic-stack.image" .Values.openclaw.kubectlInstallerImage | quote }}
          imagePullPolicy: {{ .Values.openclaw.kubectlInstallerImage.pullPolicy }}
          command: ["/bin/kubectl"]
          args:
            - label
            - namespace
            - {{ .Release.Namespace | quote }}
            {{- range $key, $value := .Values.namespace.labels }}
            - {{ printf "%s=%s" $key $value | quote }}
            {{- end }}
            - --overwrite
{{- end }}
