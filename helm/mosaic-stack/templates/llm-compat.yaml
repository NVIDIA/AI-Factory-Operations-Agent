{{- $c := .Values.llm.requestCompatibility -}}
{{- if and .Values.modules.execution.enabled $c.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $c.name }}
  labels:
    app: {{ $c.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
data:
  server.js: |
    const http = require('http');
    const upstream = new URL(process.env.UPSTREAM_BASE_URL);
    const port = Number(process.env.PORT || {{ $c.port }});
    const disableThinking = process.env.DISABLE_THINKING === 'true';

    function readBody(req) {
      return new Promise((resolve, reject) => {
        const chunks = [];
        req.on('data', chunk => chunks.push(chunk));
        req.on('end', () => resolve(Buffer.concat(chunks)));
        req.on('error', reject);
      });
    }

    function patchBody(req, body) {
      if (!disableThinking || req.method !== 'POST' || !req.url.endsWith('/chat/completions')) return body;
      try {
        const json = JSON.parse(body.toString('utf8'));
        json.chat_template_kwargs = { ...(json.chat_template_kwargs || {}), enable_thinking: false };
        return Buffer.from(JSON.stringify(json));
      } catch {
        return body;
      }
    }

    http.createServer(async (req, res) => {
      if (req.url === '/health') return res.writeHead(200).end('ok');
      const body = patchBody(req, await readBody(req));
      const target = new URL(req.url, upstream);
      const headers = { ...req.headers, host: target.host, 'content-length': String(body.length) };
      const out = http.request(target, { method: req.method, headers }, upstreamRes => {
        res.writeHead(upstreamRes.statusCode || 502, upstreamRes.headers);
        upstreamRes.pipe(res);
      });
      out.on('error', error => {
        res.writeHead(502, { 'content-type': 'application/json' });
        res.end(JSON.stringify({ error: String(error.message || error) }));
      });
      out.end(body);
    }).listen(port, '0.0.0.0');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $c.name }}
  labels:
    app: {{ $c.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $c.name }}
  template:
    metadata:
      labels:
        app: {{ $c.name }}
      annotations:
        checksum/config: {{ printf "%s-%v-%s" $c.name $c.disableThinking (include "mosaic-stack.llmUpstreamBaseUrl" .) | sha256sum }}
    spec:
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" . | nindent 6 }}
      containers:
        - name: proxy
          image: {{ include "mosaic-stack.image" .Values.mosaicUi.image | quote }}
          imagePullPolicy: {{ .Values.mosaicUi.image.pullPolicy }}
          command: ["node", "/config/server.js"]
          env:
            - name: PORT
              value: {{ $c.port | quote }}
            - name: UPSTREAM_BASE_URL
              value: {{ include "mosaic-stack.llmUpstreamBaseUrl" . | quote }}
            - name: DISABLE_THINKING
              value: {{ ternary "true" "false" $c.disableThinking | quote }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $c.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $c.name }}
  labels:
    app: {{ $c.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ $c.name }}
  ports:
    - name: http
      port: {{ $c.port }}
      targetPort: http
{{- end }}
