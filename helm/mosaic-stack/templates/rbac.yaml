{{- if and .Values.modules.execution.enabled .Values.openclaw.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
{{- if and .Values.modules.kubernetes.enabled .Values.kubernetes.local.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-oc-reader
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "events", "namespaces", "nodes", "pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "prometheuses", "servicemonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/openapi", "/openapi/*", "/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-oc-reader
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: {{ .Release.Namespace }}
  {{- if .Values.modules.terminal.enabled }}
  - kind: ServiceAccount
    name: mosaic-terminal
    namespace: {{ .Release.Namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-oc-reader
{{- if and .Values.modules.edit.enabled .Values.modules.edit.kubernetes.enabled }}
{{- if not .Values.modules.edit.kubernetes.existingClusterRole }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-oc-editor
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "services"]
    verbs: ["create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets"]
    verbs: ["create", "delete", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["create", "delete", "patch", "update"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-oc-editor
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ default (printf "%s-oc-editor" (include "mosaic-stack.clusterScopedBase" .)) .Values.modules.edit.kubernetes.existingClusterRole }}
{{- end }}
{{- end }}
---
{{- end }}
