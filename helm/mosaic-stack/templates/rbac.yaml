{{- if .Values.mosaicUi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mosaic-ui
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mosaic-ui
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mosaic-ui
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: mosaic-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mosaic-ui
---
{{- end }}
{{- if .Values.openclaw.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-oc-reader
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "events", "namespaces", "nodes", "pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "prometheuses", "servicemonitors"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/openapi", "/openapi/*", "/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-oc-reader
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mosaic-stack.clusterScopedBase" . }}-oc-reader
---
{{- end }}
