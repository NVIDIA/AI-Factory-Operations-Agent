{{- if and .Values.modules.execution.enabled .Values.openclaw.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-seed
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
data:
  openclaw.json: |-
{{ tpl (.Files.Get "files/openclaw-seed/nemoclaw.json") . | indent 4 }}
  AGENTS.md: |-
{{ tpl (.Files.Get "files/openclaw-seed/workspace/AGENTS.md") . | indent 4 }}
  HEARTBEAT.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/HEARTBEAT.md" | indent 4 }}
  IDENTITY.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/IDENTITY.md" | indent 4 }}
  SOUL.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/SOUL.md" | indent 4 }}
  TOOLS.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/TOOLS.md" | indent 4 }}
  USER.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/USER.md" | indent 4 }}
  automation-context.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/automation-context.ts" | indent 4 }}
  diagnostic-policy.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/diagnostic-policy.ts" | indent 4 }}
  automation-guard.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/automation-guard/index.ts" | indent 4 }}
  automation-guard.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/automation-guard/openclaw.plugin.json" | indent 4 }}
  automation-guard.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/automation-guard/package.json" | indent 4 }}
  mutation-ledger.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/mutation-ledger.ts" | indent 4 }}
  {{- if .Values.modules.kubernetes.enabled }}
  kubernetes.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/kubernetes/index.ts" | indent 4 }}
  kubernetes.policy.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/kubernetes/policy.ts" | indent 4 }}
  kubernetes.runner.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/kubernetes/runner.ts" | indent 4 }}
  kubernetes.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/kubernetes/openclaw.plugin.json" | indent 4 }}
  kubernetes.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/kubernetes/package.json" | indent 4 }}
  {{- end }}
  {{- if and .Values.modules.edit.enabled .Values.modules.edit.ssh.enabled }}
  remote-ssh.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/remote-ssh/index.ts" | indent 4 }}
  remote-ssh.policy.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/remote-ssh/policy.ts" | indent 4 }}
  remote-ssh.runner.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/remote-ssh/runner.ts" | indent 4 }}
  remote-ssh.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/remote-ssh/openclaw.plugin.json" | indent 4 }}
  remote-ssh.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/remote-ssh/package.json" | indent 4 }}
  {{- end }}
  {{- if .Values.modules.diagnostics.enabled }}
  diagnostic-agent.SKILL.md: |-
{{ .Files.Get "files/openclaw-seed/skills/diagnostic-agent/SKILL.md" | indent 4 }}
  {{- end }}
  {{- if .Values.modules.research.enabled }}
  iraop.SKILL.md: |-
{{ .Files.Get "files/openclaw-seed/skills/iraop/SKILL.md" | indent 4 }}
  {{- end }}
  {{- if and .Values.modules.observability.enabled .Values.modules.grafana.enabled }}
  grafana.SKILL.md: |-
{{ .Files.Get "files/openclaw-seed/skills/grafana/SKILL.md" | indent 4 }}
  {{- end }}
  {{- if .Values.modules.slurm.enabled }}
  slurm.SKILL.md: |-
{{ .Files.Get "files/openclaw-seed/skills/slurm/SKILL.md" | indent 4 }}
  slurm.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/slurm/index.ts" | indent 4 }}
  slurm.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/slurm/openclaw.plugin.json" | indent 4 }}
  slurm.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/slurm/package.json" | indent 4 }}
  {{- end }}
  {{- if .Values.modules.observability.enabled }}
  observability.SKILL.md: |-
{{ .Files.Get "files/openclaw-seed/skills/observability/SKILL.md" | indent 4 }}
  {{- end }}
  {{- if eq (include "mosaic-stack.bcmEnabled" .) "true" }}
  bcm.SKILL.md: |-
{{ .Files.Get "files/openclaw-seed/skills/bcm/SKILL.md" | indent 4 }}
  bcm-docs-download.py: |-
{{ .Files.Get "files/bcm-docs/download_bcm_docs.py" | indent 4 }}
  {{- end }}
  {{- if .Values.modules.diagnostics.enabled }}
  diagnostic-agent.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/diagnostic-agent/index.ts" | indent 4 }}
  diagnostic-agent.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/diagnostic-agent/openclaw.plugin.json" | indent 4 }}
  diagnostic-agent.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/diagnostic-agent/package.json" | indent 4 }}
  {{- end }}
  {{- if .Values.modules.research.enabled }}
  iraop.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/iraop/index.ts" | indent 4 }}
  iraop.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/iraop/openclaw.plugin.json" | indent 4 }}
  iraop.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/iraop/package.json" | indent 4 }}
  {{- end }}
  {{- if eq (include "mosaic-stack.bcmEnabled" .) "true" }}
  bcm.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/bcm/index.ts" | indent 4 }}
  bcm.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/bcm/openclaw.plugin.json" | indent 4 }}
  bcm.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/bcm/package.json" | indent 4 }}
  {{- end }}
  {{- if .Values.modules.observability.enabled }}
  observability.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/observability/index.ts" | indent 4 }}
  observability.grafana.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/observability/grafana.ts" | indent 4 }}
  observability.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/observability/openclaw.plugin.json" | indent 4 }}
  observability.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/observability/package.json" | indent 4 }}
  {{- end }}
  {{- if and .Values.modules.observability.enabled .Values.modules.grafana.enabled }}
  grafana.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/grafana/index.ts" | indent 4 }}
  grafana.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/grafana/openclaw.plugin.json" | indent 4 }}
  grafana.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/grafana/package.json" | indent 4 }}
  {{- end }}
{{- end }}
