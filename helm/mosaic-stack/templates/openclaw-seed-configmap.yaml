{{- if and .Values.modules.execution.enabled .Values.openclaw.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-seed
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
data:
  openclaw.json: |-
{{ tpl (.Files.Get "files/openclaw-seed/nemoclaw.json") . | indent 4 }}
  k8s-readonly-policy.yaml: |-
{{ .Files.Get "files/openclaw-seed/workspace/k8s-readonly-policy.yaml" | indent 4 }}
  AGENTS.md: |-
{{ tpl (.Files.Get "files/openclaw-seed/workspace/AGENTS.md") . | indent 4 }}
  HEARTBEAT.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/HEARTBEAT.md" | indent 4 }}
  IDENTITY.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/IDENTITY.md" | indent 4 }}
  SOUL.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/SOUL.md" | indent 4 }}
  TOOLS.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/TOOLS.md" | indent 4 }}
  USER.md: |-
{{ .Files.Get "files/openclaw-seed/workspace/USER.md" | indent 4 }}
  {{- if .Values.modules.slurm.enabled }}
  slurm.SKILL.md: |-
{{ .Files.Get "files/openclaw-seed/skills/slurm/SKILL.md" | indent 4 }}
  slurm-job-116.txt: |-
{{ .Files.Get "files/openclaw-seed/shared-logs/llama3-70b-pretrain-stage1_116_date_26-05-15_time_08-42-46.txt" | indent 4 }}
  {{- end }}
  {{- if .Values.modules.observability.enabled }}
  observability.SKILL.md: |-
{{ .Files.Get "files/openclaw-seed/skills/observability/SKILL.md" | indent 4 }}
  {{- end }}
  {{- if and .Values.modules.observability.enabled .Values.modules.grafana.enabled }}
  grafana.SKILL.md: |-
{{ .Files.Get "files/openclaw-seed/skills/grafana/SKILL.md" | indent 4 }}
  {{- end }}
  {{- if .Values.modules.observability.enabled }}
  dcgm.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/dcgm/index.ts" | indent 4 }}
  dcgm.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/dcgm/openclaw.plugin.json" | indent 4 }}
  dcgm.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/dcgm/package.json" | indent 4 }}
  observability.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/observability/index.ts" | indent 4 }}
  observability.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/observability/openclaw.plugin.json" | indent 4 }}
  observability.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/observability/package.json" | indent 4 }}
  {{- end }}
  {{- if and .Values.modules.observability.enabled .Values.modules.grafana.enabled }}
  grafana.index.ts: |-
{{ .Files.Get "files/openclaw-seed/extensions/grafana/index.ts" | indent 4 }}
  grafana.openclaw.plugin.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/grafana/openclaw.plugin.json" | indent 4 }}
  grafana.package.json: |-
{{ .Files.Get "files/openclaw-seed/extensions/grafana/package.json" | indent 4 }}
  {{- end }}
{{- end }}
