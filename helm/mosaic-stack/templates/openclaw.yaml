{{- if and .Values.modules.execution.enabled .Values.openclaw.enabled }}
{{- $observability := default dict .Values.observability }}
{{- $kubernetesClusters := include "mosaic-stack.kubernetesClusters" . | fromJson }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  labels:
    app: openclaw
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openclaw
      annotations:
        checksum/openclaw-seed: {{ include (print $.Template.BasePath "/openclaw-seed-configmap.yaml") . | sha256sum }}
        checksum/bcm-auth-config: {{ printf "%s:%s:%s" .Values.bcmMcp.authTokenSecretName .Values.bcmMcp.authTokenSecretKey .Values.bcmMcp.authToken | sha256sum }}
    spec:
      serviceAccountName: openclaw
      automountServiceAccountToken: {{ and .Values.modules.kubernetes.enabled .Values.kubernetes.local.enabled }}
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" . | nindent 6 }}
      {{- include "mosaic-stack.tolerations" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- if .Values.modules.kubernetes.enabled }}
        - name: install-kubectl
          image: {{ include "mosaic-stack.image" .Values.openclaw.image | quote }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              case "$(uname -m)" in
                x86_64) architecture=amd64; sha={{ .Values.kubernetes.kubectlSha256.amd64 | quote }} ;;
                aarch64|arm64) architecture=arm64; sha={{ .Values.kubernetes.kubectlSha256.arm64 | quote }} ;;
                *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              curl -fsSL --retry 5 --retry-all-errors -o /tools/kubectl \
                "https://dl.k8s.io/release/{{ .Values.kubernetes.kubectlVersion }}/bin/linux/$architecture/kubectl"
              printf '%s  %s\n' "$sha" /tools/kubectl | sha256sum -c -
              chmod 0555 /tools/kubectl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: runtime-tools
              mountPath: /tools
        {{- end }}
        - name: install-openssh-client
          image: {{ .Values.openclaw.opensshInstallerImage | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              root=/tools/openssh
              rm -rf "$root"
              mkdir -p "$root/lib" "$root/usr/bin" "$root/usr/lib"
              cp /lib/ld-musl-*.so.1 "$root/lib/"
              cp /usr/lib/libcrypto.so.3 /usr/lib/libz.so.1 "$root/usr/lib/"
              cp /usr/bin/ssh /usr/bin/scp /usr/bin/sftp "$root/usr/bin/"
              loader=$(basename /lib/ld-musl-*.so.1)
              for command in ssh scp sftp; do
                printf '#!/bin/sh\nexec /tools/openssh/lib/%s --library-path /tools/openssh/usr/lib:/tools/openssh/lib /tools/openssh/usr/bin/%s "$@"\n' "$loader" "$command" > "/tools/$command"
                chmod 0555 "/tools/$command"
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: runtime-tools
              mountPath: /tools
        - name: init-perms
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown 1000:1000 /home/node/.openclaw && chmod 0775 /home/node/.openclaw"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
        - name: init-config
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/node/.openclaw/tmp/openclaw /home/node/.openclaw/workspace/skills
              chmod 700 /home/node/.openclaw/tmp /home/node/.openclaw/tmp/openclaw
              rm -rf /home/node/.openclaw/extensions/automation-guard \
                /home/node/.openclaw/extensions/bcm \
                /home/node/.openclaw/extensions/dcgm \
                /home/node/.openclaw/extensions/diagnostic-agent \
                /home/node/.openclaw/extensions/grafana \
                /home/node/.openclaw/extensions/iraop \
                /home/node/.openclaw/extensions/kubernetes \
                /home/node/.openclaw/extensions/observability \
                /home/node/.openclaw/extensions/remote-ssh \
                /home/node/.openclaw/extensions/slurm \
                /home/node/.openclaw/workspace/skills/bcm \
                /home/node/.openclaw/workspace/skills/grafana \
                /home/node/.openclaw/workspace/skills/diagnostic-agent \
                /home/node/.openclaw/workspace/skills/hardware-agent \
                /home/node/.openclaw/workspace/skills/iraop \
                /home/node/.openclaw/workspace/skills/observability \
                /home/node/.openclaw/workspace/skills/slurm
              rm -f /home/node/.openclaw/extensions/automation-context.ts \
                /home/node/.openclaw/extensions/diagnostic-policy.ts \
                /home/node/.openclaw/extensions/mutation-ledger.ts
              mkdir -p /home/node/.openclaw/extensions/automation-guard
              cp /seed/automation-context.ts /home/node/.openclaw/extensions/automation-context.ts
              cp /seed/diagnostic-policy.ts /home/node/.openclaw/extensions/diagnostic-policy.ts
              cp /seed/automation-guard.index.ts /home/node/.openclaw/extensions/automation-guard/index.ts
              cp /seed/automation-guard.slack-approval.ts /home/node/.openclaw/extensions/automation-guard/slack-approval.ts
              cp /seed/automation-guard.openclaw.plugin.json /home/node/.openclaw/extensions/automation-guard/openclaw.plugin.json
              cp /seed/automation-guard.package.json /home/node/.openclaw/extensions/automation-guard/package.json
              cp /seed/mutation-ledger.ts /home/node/.openclaw/extensions/mutation-ledger.ts
              {{- if .Values.modules.slurm.enabled }}
              mkdir -p /home/node/.openclaw/workspace/skills/slurm
              mkdir -p /home/node/.openclaw/extensions/slurm
              {{- end }}
              {{- if .Values.modules.observability.enabled }}
              mkdir -p /home/node/.openclaw/workspace/skills/observability
              {{- end }}
              {{- if .Values.modules.kubernetes.enabled }}
              mkdir -p /home/node/.openclaw/extensions/kubernetes
              cp /seed/kubernetes.index.ts /home/node/.openclaw/extensions/kubernetes/index.ts
              cp /seed/kubernetes.policy.ts /home/node/.openclaw/extensions/kubernetes/policy.ts
              cp /seed/kubernetes.runner.ts /home/node/.openclaw/extensions/kubernetes/runner.ts
              cp /seed/kubernetes.openclaw.plugin.json /home/node/.openclaw/extensions/kubernetes/openclaw.plugin.json
              cp /seed/kubernetes.package.json /home/node/.openclaw/extensions/kubernetes/package.json
              {{- end }}
              {{- if and .Values.modules.edit.enabled .Values.modules.edit.ssh.enabled }}
              mkdir -p /home/node/.openclaw/extensions/remote-ssh
              cp /seed/remote-ssh.index.ts /home/node/.openclaw/extensions/remote-ssh/index.ts
              cp /seed/remote-ssh.policy.ts /home/node/.openclaw/extensions/remote-ssh/policy.ts
              cp /seed/remote-ssh.runner.ts /home/node/.openclaw/extensions/remote-ssh/runner.ts
              cp /seed/remote-ssh.openclaw.plugin.json /home/node/.openclaw/extensions/remote-ssh/openclaw.plugin.json
              cp /seed/remote-ssh.package.json /home/node/.openclaw/extensions/remote-ssh/package.json
              {{- end }}
              {{- if .Values.modules.research.enabled }}
              mkdir -p /home/node/.openclaw/workspace/skills/iraop
              mkdir -p /home/node/.openclaw/extensions/iraop
              {{- end }}
              {{- if .Values.modules.diagnostics.enabled }}
              mkdir -p /home/node/.openclaw/workspace/skills/hardware-agent
              mkdir -p /home/node/.openclaw/extensions/diagnostic-agent
              {{- end }}
              {{- if eq (include "mosaic-stack.bcmEnabled" .) "true" }}
              mkdir -p /home/node/.openclaw/workspace/skills/bcm
              mkdir -p /home/node/.openclaw/extensions/bcm
              {{- end }}
              mkdir -p /home/node/.openclaw/policies
              {{- if .Values.modules.observability.enabled }}
              mkdir -p /home/node/.openclaw/extensions/observability
              {{- end }}
              {{- if and .Values.modules.kubernetes.enabled .Values.kubernetes.local.enabled }}
              mkdir -p /var/run/mosaic-kubernetes/local
              cat > /var/run/mosaic-kubernetes/local/config <<EOF
              apiVersion: v1
              kind: Config
              clusters:
                - name: in-cluster
                  cluster:
                    server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS:-443}
                    certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              contexts:
                - name: in-cluster
                  context:
                    cluster: in-cluster
                    namespace: $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
                    user: openclaw
              current-context: in-cluster
              users:
                - name: openclaw
                  user:
                    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              EOF
              chmod 600 /var/run/mosaic-kubernetes/local/config
              {{- end }}
              cp /seed/openclaw.json /home/node/.openclaw/openclaw.json
              rm -rf /home/node/.openclaw/identity /home/node/.openclaw/devices
              cp /seed/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
              cp /seed/HEARTBEAT.md /home/node/.openclaw/workspace/HEARTBEAT.md
              cp /seed/IDENTITY.md /home/node/.openclaw/workspace/IDENTITY.md
              cp /seed/SOUL.md /home/node/.openclaw/workspace/SOUL.md
              cp /seed/TOOLS.md /home/node/.openclaw/workspace/TOOLS.md
              cp /seed/USER.md /home/node/.openclaw/workspace/USER.md
              {{- if .Values.modules.slurm.enabled }}
              cp /seed/slurm.SKILL.md /home/node/.openclaw/workspace/skills/slurm/SKILL.md
              cp /seed/slurm.index.ts /home/node/.openclaw/extensions/slurm/index.ts
              cp /seed/slurm.openclaw.plugin.json /home/node/.openclaw/extensions/slurm/openclaw.plugin.json
              cp /seed/slurm.package.json /home/node/.openclaw/extensions/slurm/package.json
              {{- end }}
              {{- if .Values.modules.observability.enabled }}
              cp /seed/observability.SKILL.md /home/node/.openclaw/workspace/skills/observability/SKILL.md
              cp /seed/observability.index.ts /home/node/.openclaw/extensions/observability/index.ts
              cp /seed/observability.grafana.ts /home/node/.openclaw/extensions/observability/grafana.ts
              cp /seed/observability.openclaw.plugin.json /home/node/.openclaw/extensions/observability/openclaw.plugin.json
              cp /seed/observability.package.json /home/node/.openclaw/extensions/observability/package.json
              {{- end }}
              {{- if .Values.modules.research.enabled }}
              cp /seed/iraop.SKILL.md /home/node/.openclaw/workspace/skills/iraop/SKILL.md
              cp /seed/iraop.index.ts /home/node/.openclaw/extensions/iraop/index.ts
              cp /seed/iraop.openclaw.plugin.json /home/node/.openclaw/extensions/iraop/openclaw.plugin.json
              cp /seed/iraop.package.json /home/node/.openclaw/extensions/iraop/package.json
              {{- end }}
              {{- if .Values.modules.diagnostics.enabled }}
              cp /seed/hardware-agent.SKILL.md /home/node/.openclaw/workspace/skills/hardware-agent/SKILL.md
              cp /seed/diagnostic-agent.index.ts /home/node/.openclaw/extensions/diagnostic-agent/index.ts
              cp /seed/diagnostic-agent.openclaw.plugin.json /home/node/.openclaw/extensions/diagnostic-agent/openclaw.plugin.json
              cp /seed/diagnostic-agent.package.json /home/node/.openclaw/extensions/diagnostic-agent/package.json
              {{- end }}
              {{- if eq (include "mosaic-stack.bcmEnabled" .) "true" }}
              cp /seed/bcm.SKILL.md /home/node/.openclaw/workspace/skills/bcm/SKILL.md
              cp /seed/bcm.index.ts /home/node/.openclaw/extensions/bcm/index.ts
              cp /seed/bcm.openclaw.plugin.json /home/node/.openclaw/extensions/bcm/openclaw.plugin.json
              cp /seed/bcm.package.json /home/node/.openclaw/extensions/bcm/package.json
              {{- end }}
              rm -rf /home/node/.openclaw/workspace/.openclaw/sandbox-skills
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: openclaw-seed
              mountPath: /seed
            {{- if .Values.modules.kubernetes.enabled }}
            - name: kubernetes-configs
              mountPath: /var/run/mosaic-kubernetes
            {{- end }}
        {{- if and .Values.modules.edit.enabled .Values.modules.edit.ssh.enabled }}
        - name: init-remote-ssh-credentials
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              cp /source/private-key /credentials/id
              cp /source/known-hosts /credentials/known_hosts
              chmod 0400 /credentials/id
              chmod 0444 /credentials/known_hosts
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: remote-ssh-source
              mountPath: /source
              readOnly: true
            - name: remote-ssh-credentials
              mountPath: /credentials
        {{- end }}
        {{- if .Values.openclaw.slack.enabled }}
        - name: init-slack-plugin
          image: {{ include "mosaic-stack.image" .Values.openclaw.image | quote }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              node /app/dist/index.js plugins install {{ printf "@openclaw/slack@%v" .Values.openclaw.slack.pluginVersion | quote }} --force
              node /seed/slack-enterprise-grid-patch.mjs
          env:
            - name: HOME
              value: /home/node
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: openclaw-seed
              mountPath: /seed
        {{- end }}
        {{- if eq (include "mosaic-stack.bcmEnabled" .) "true" }}
        - name: init-bcm-docs
          image: {{ include "mosaic-stack.image" .Values.mosaicUi.image | quote }}
          imagePullPolicy: {{ .Values.mosaicUi.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              docs=/home/node/.openclaw/workspace/docs
              skill_docs=/home/node/.openclaw/workspace/skills/bcm/docs
              rm -rf "$docs" "$skill_docs"
              mkdir -p "$docs" "$skill_docs"
              tar -xzf /opt/nemoclaw/bcm-docs.tar.gz -C "$docs"
              tar -xzf /opt/nemoclaw/bcm-docs.tar.gz -C "$skill_docs"
              chown -R 1000:1000 "$docs" "$skill_docs"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
        {{- end }}
        - name: install-openshell-assets
          image: {{ include "mosaic-stack.image" .Values.openclaw.image | quote }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              case "$(uname -m)" in
                x86_64) target=x86_64-unknown-linux-musl; sha={{ .Values.openclaw.openshell.cliSha256.amd64 | quote }} ;;
                aarch64|arm64) target=aarch64-unknown-linux-musl; sha={{ .Values.openclaw.openshell.cliSha256.arm64 | quote }} ;;
                *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              cli=/tmp/openshell-cli.tar.gz
              curl -fsSL --retry 5 --retry-all-errors -o "$cli" \
                "https://github.com/NVIDIA/OpenShell/releases/download/{{ .Values.openclaw.openshell.cliVersion }}/openshell-$target.tar.gz"
              printf '%s  %s\n' "$sha" "$cli" | sha256sum -c -
              tar -xzf "$cli" -C /tools
              mv /tools/openshell /tools/openshell.real
              chmod 0555 /tools/openshell.real
              cat > /tools/openshell <<'EOF'
              #!/bin/sh
              set -eu
              real=/tools/openshell.real
              previous=
              sandbox_name=
              is_create=false
              has_command=false
              for argument in "$@"; do
                if [ "$previous" = sandbox ] && [ "$argument" = create ]; then
                  is_create=true
                elif [ "$previous" = --name ]; then
                  sandbox_name=$argument
                fi
                [ "$argument" = -- ] && has_command=true
                previous=$argument
              done
              if [ "$is_create" != true ]; then
                exec "$real" "$@"
              fi
              if [ -z "$sandbox_name" ]; then
                echo "openshell sandbox create requires --name" >&2
                exit 2
              fi
              log=/tmp/openshell-create-$$.log
              if [ "$has_command" = true ]; then
                "$real" "$@" >"$log" 2>&1 &
              else
                "$real" "$@" --no-tty -- true >"$log" 2>&1 &
              fi
              create_pid=$!
              attempts=0
              while [ "$attempts" -lt 180 ]; do
                if "$real" sandbox exec --name "$sandbox_name" -- true >/dev/null 2>&1; then
                  wait "$create_pid" >/dev/null 2>&1 || true
                  rm -f "$log"
                  exit 0
                fi
                attempts=$((attempts + 1))
                sleep 1
              done
              wait "$create_pid" >/dev/null 2>&1 || true
              cat "$log" >&2
              rm -f "$log"
              echo "openshell sandbox create timed out waiting for SSH" >&2
              exit 1
              EOF
              chmod 0555 /tools/openshell

              plugin=/tmp/openshell-plugin.tar.gz
              curl -fsSL --retry 5 --retry-all-errors -o "$plugin" \
                "https://registry.npmjs.org/@openclaw/openshell-sandbox/-/openshell-sandbox-{{ .Values.openclaw.openshell.pluginVersion }}.tgz"
              printf '%s  %s\n' {{ .Values.openclaw.openshell.pluginSha256 | quote }} "$plugin" | sha256sum -c -
              rm -rf /openshell-plugin/*
              tar -xzf "$plugin" --strip-components=1 -C /openshell-plugin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: runtime-tools
              mountPath: /tools
            - name: openshell-plugin
              mountPath: /openshell-plugin
        - name: init-openshell-plugin
          image: {{ include "mosaic-stack.image" .Values.openclaw.image | quote }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              node /app/dist/index.js plugins install /openshell-plugin --force
              config_root=/home/node/.openclaw/.config/openshell
              gateway_name={{ include "mosaic-stack.openshellGatewayName" . | quote }}
              gateway_endpoint={{ include "mosaic-stack.openshellGatewayEndpoint" . | quote }}
              metadata_path="$config_root/gateways/$gateway_name/metadata.json"
              mkdir -p "$(dirname "$metadata_path")"
              printf "%s" "$gateway_name" > "$config_root/active_gateway"
              node - "$metadata_path" "$gateway_name" "$gateway_endpoint" <<'EOF'
              const fs = require("fs");
              const path = require("path");
              const [metadataPath, name, endpoint] = process.argv.slice(2);
              fs.mkdirSync(path.dirname(metadataPath), { recursive: true });
              fs.writeFileSync(metadataPath, JSON.stringify({
                name,
                gateway_endpoint: endpoint,
                is_remote: false,
                gateway_port: 0,
                auth_mode: {{ ternary "\"plaintext\"" "\"mtls\"" .Values.openshell.server.disableTls }}
              }, null, 2));
              EOF
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: openshell-plugin
              mountPath: /openshell-plugin
      containers:
        - name: gateway
          image: {{ include "mosaic-stack.image" .Values.openclaw.image | quote }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["node", "/app/dist/index.js", "gateway", "run"]
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: XDG_CONFIG_HOME
              value: /home/node/.openclaw/.config
            - name: NODE_ENV
              value: production
            - name: PATH
              value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: OPENSHELL_GATEWAY
              value: {{ include "mosaic-stack.openshellGatewayName" . | quote }}
            - name: OPENSHELL_GATEWAY_ENDPOINT
              value: {{ include "mosaic-stack.openshellGatewayEndpoint" . | quote }}
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openclaw.secrets.name }}
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: VLLM_API_KEY
              {{- if and (eq .Values.llm.mode "external") .Values.llm.external.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.external.existingSecret }}
                  key: {{ .Values.llm.external.apiKeySecretKey }}
              {{- else }}
              value: local-vllm
              {{- end }}
            - name: OPENCLAW_VLLM_BASE_URL
              value: {{ include "mosaic-stack.llmBaseUrl" . | quote }}
            {{- if .Values.openclaw.slack.enabled }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openclaw.slack.existingSecret | quote }}
                  key: {{ .Values.openclaw.slack.botTokenKey | quote }}
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openclaw.slack.existingSecret | quote }}
                  key: {{ .Values.openclaw.slack.appTokenKey | quote }}
            {{- end }}
            - name: MOSAIC_PROMETHEUS_URL
              value: {{ $observability.prometheusUrl | quote }}
            - name: MOSAIC_GRAFANA_URL
              value: {{ $observability.grafanaUrl | quote }}
            {{- with $observability.grafanaAuth.existingSecret }}
            - name: MOSAIC_GRAFANA_BASIC_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $observability.grafanaAuth.usernameKey }}
            - name: MOSAIC_GRAFANA_BASIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $observability.grafanaAuth.passwordKey }}
            {{- end }}
            - name: MOSAIC_UI_URL
              value: {{ printf "http://mosaic-ui.%s.svc.cluster.local:3000" .Release.Namespace | quote }}
            {{- if and .Values.bcmMcp.enabled (eq .Values.bcmMcp.mode "ssh-adapter") }}
            - name: MOSAIC_BCM_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bcmMcp.authTokenSecretName }}
                  key: {{ .Values.bcmMcp.authTokenSecretKey }}
            {{- end }}
            {{- if .Values.modules.diagnostics.enabled }}
            - name: DIAGNOSTIC_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.diagnosticAgent.apiKeySecretName }}
                  key: API_KEY
            {{- end }}
            {{- if eq (include "mosaic-stack.slurmEvidenceEnabled" .) "true" }}
            - name: MOSAIC_SLURM_EVIDENCE_URL
              value: {{ printf "http://slurm-evidence-collector.%s.svc.cluster.local:%v" .Release.Namespace (default 8080 .Values.slurmEvidenceCollector.port) | quote }}
            - name: MOSAIC_SLURM_EVIDENCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default "slurm-evidence-auth" .Values.slurmEvidenceCollector.auth.secretName }}
                  key: {{ default "token" .Values.slurmEvidenceCollector.auth.secretKey }}
            {{- end }}
          ports:
            - containerPort: 18789
              name: gateway
          readinessProbe:
            exec:
              command: ["node", "-e", "require(\"http\").get(\"http://127.0.0.1:18789/readyz\", r => process.exit(r.statusCode < 400 ? 0 : 1)).on(\"error\", () => process.exit(1))"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["node", "-e", "require(\"http\").get(\"http://127.0.0.1:18789/healthz\", r => process.exit(r.statusCode < 400 ? 0 : 1)).on(\"error\", () => process.exit(1))"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: openclaw-home
              mountPath: /tmp
              subPath: tmp
            - name: runtime-tools
              mountPath: /tools
              readOnly: true
            {{- if not .Values.openshell.server.disableTls }}
            - name: openshell-client-tls
              mountPath: /home/node/.openclaw/.config/openshell/gateways/{{ include "mosaic-stack.openshellGatewayName" . }}/mtls
              readOnly: true
            {{- end }}
            {{- if .Values.modules.kubernetes.enabled }}
            - name: kubernetes-configs
              mountPath: /var/run/mosaic-kubernetes
              readOnly: true
            {{- range $index, $cluster := .Values.kubernetes.clusters }}
            - name: kubernetes-external-{{ $index }}
              mountPath: /var/run/mosaic-kubernetes-external/{{ $cluster.name }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if and .Values.modules.edit.enabled .Values.modules.edit.ssh.enabled }}
            - name: remote-ssh-credentials
              mountPath: /var/run/mosaic-ssh
              readOnly: true
            {{- end }}
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: openclaw-home-pvc
        - name: openclaw-seed
          configMap:
            name: openclaw-seed
        - name: runtime-tools
          emptyDir: {}
        - name: openshell-plugin
          emptyDir: {}
        {{- if and .Values.modules.edit.enabled .Values.modules.edit.ssh.enabled }}
        - name: remote-ssh-source
          secret:
            secretName: {{ .Values.modules.edit.ssh.existingSecret | quote }}
            items:
              - key: {{ .Values.modules.edit.ssh.privateKeyKey | quote }}
                path: private-key
              - key: {{ .Values.modules.edit.ssh.knownHostsKey | quote }}
                path: known-hosts
        - name: remote-ssh-credentials
          emptyDir:
            medium: Memory
        {{- end }}
        {{- if not .Values.openshell.server.disableTls }}
        - name: openshell-client-tls
          secret:
            secretName: {{ .Values.openshell.server.tls.clientTlsSecretName | quote }}
        {{- end }}
        {{- if .Values.modules.kubernetes.enabled }}
        - name: kubernetes-configs
          emptyDir: {}
        {{- range $index, $cluster := .Values.kubernetes.clusters }}
        - name: kubernetes-external-{{ $index }}
          secret:
            secretName: {{ $cluster.kubeconfigSecretRef.name | quote }}
            items:
              - key: {{ $cluster.kubeconfigSecretRef.key | quote }}
                path: config
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  labels:
    app: openclaw
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: openclaw
  ports:
    - name: gateway
      port: {{ .Values.openclaw.service.port }}
      targetPort: gateway
  type: ClusterIP
{{- end }}
