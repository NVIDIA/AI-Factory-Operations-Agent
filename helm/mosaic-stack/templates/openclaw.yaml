{{- if and .Values.modules.execution.enabled .Values.openclaw.enabled }}
{{- $observability := default dict .Values.observability }}
{{- $bcmDocs := mergeOverwrite (dict "enabled" true "baseUrl" "https://docs.nvidia.com/base-command-manager/manuals" "version" "11" "timeoutSeconds" "60") (.Values.bcmDocs | default dict) }}
{{- $bcmDocsImage := mergeOverwrite (dict "repository" "python" "tag" "3.12-alpine" "pullPolicy" "IfNotPresent") ($bcmDocs.image | default dict) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  labels:
    app: openclaw
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openclaw
      annotations:
        checksum/openclaw-seed: {{ include (print $.Template.BasePath "/openclaw-seed-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: openclaw
      automountServiceAccountToken: true
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-perms
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown 1000:1000 /home/node/.openclaw && chmod 0775 /home/node/.openclaw"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
        - name: init-config
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/node/.openclaw/tmp/openclaw
              chmod 700 /home/node/.openclaw/tmp /home/node/.openclaw/tmp/openclaw
              rm -rf /home/node/.openclaw/extensions/dcgm \
                /home/node/.openclaw/extensions/grafana \
                /home/node/.openclaw/extensions/slurm \
                /home/node/.openclaw/workspace/skills/grafana \
                /home/node/.openclaw/workspace/skills/slurm \
                /home/node/.openclaw/workspace/k8s-readonly-policy.yaml
              {{- if .Values.modules.slurm.enabled }}
              mkdir -p /home/node/.openclaw/workspace/skills/slurm
              mkdir -p /home/node/.openclaw/extensions/slurm
              {{- end }}
              {{- if .Values.modules.observability.enabled }}
              mkdir -p /home/node/.openclaw/workspace/skills/observability
              {{- end }}
              {{- if eq (include "mosaic-stack.bcmEnabled" .) "true" }}
              mkdir -p /home/node/.openclaw/workspace/skills/bcm
              mkdir -p /home/node/.openclaw/extensions/bcm
              {{- end }}
              mkdir -p /home/node/.openclaw/workspace/.kube /home/node/.openclaw/workspace/kube /home/node/.openclaw/policies
              {{- if .Values.modules.observability.enabled }}
              mkdir -p /home/node/.openclaw/extensions/observability
              {{- end }}
              cat > /home/node/.openclaw/kubeconfig <<EOF
              apiVersion: v1
              kind: Config
              clusters:
                - name: in-cluster
                  cluster:
                    server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}
                    certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              contexts:
                - name: in-cluster
                  context:
                    cluster: in-cluster
                    namespace: $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
                    user: openclaw
              current-context: in-cluster
              users:
                - name: openclaw
                  user:
                    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              EOF
              chmod 600 /home/node/.openclaw/kubeconfig
              ca_data="$(base64 < /var/run/secrets/kubernetes.io/serviceaccount/ca.crt | tr -d '\n')"
              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              cat > /home/node/.openclaw/workspace/kubeconfig <<EOF
              apiVersion: v1
              kind: Config
              clusters:
                - name: in-cluster
                  cluster:
                    server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS:-443}
                    certificate-authority-data: ${ca_data}
              contexts:
                - name: in-cluster
                  context:
                    cluster: in-cluster
                    namespace: ${namespace}
                    user: openclaw
              current-context: in-cluster
              users:
                - name: openclaw
                  user:
                    token: ${token}
              EOF
              chmod 600 /home/node/.openclaw/workspace/kubeconfig
              cp /home/node/.openclaw/workspace/kubeconfig /home/node/.openclaw/workspace/.kube/config
              chmod 600 /home/node/.openclaw/workspace/.kube/config
              cp /home/node/.openclaw/workspace/.kube/config /home/node/.openclaw/workspace/kube/config
              chmod 600 /home/node/.openclaw/workspace/kube/config
              cp /seed/k8s-readonly-policy.yaml /home/node/.openclaw/policies/k8s-readonly-policy.yaml
              sed -i "s|__KUBERNETES_SERVICE_HOST__|${KUBERNETES_SERVICE_HOST}|g" /home/node/.openclaw/policies/k8s-readonly-policy.yaml
              cp /seed/openclaw.json /home/node/.openclaw/openclaw.json
              rm -rf /home/node/.openclaw/identity /home/node/.openclaw/devices
              cp /seed/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
              cp /seed/HEARTBEAT.md /home/node/.openclaw/workspace/HEARTBEAT.md
              cp /seed/IDENTITY.md /home/node/.openclaw/workspace/IDENTITY.md
              cp /seed/SOUL.md /home/node/.openclaw/workspace/SOUL.md
              cp /seed/TOOLS.md /home/node/.openclaw/workspace/TOOLS.md
              cp /seed/USER.md /home/node/.openclaw/workspace/USER.md
              {{- if .Values.modules.slurm.enabled }}
              cp /seed/slurm.SKILL.md /home/node/.openclaw/workspace/skills/slurm/SKILL.md
              cp /seed/slurm.index.ts /home/node/.openclaw/extensions/slurm/index.ts
              cp /seed/slurm.openclaw.plugin.json /home/node/.openclaw/extensions/slurm/openclaw.plugin.json
              cp /seed/slurm.package.json /home/node/.openclaw/extensions/slurm/package.json
              {{- end }}
              {{- if .Values.modules.observability.enabled }}
              cp /seed/observability.SKILL.md /home/node/.openclaw/workspace/skills/observability/SKILL.md
              cp /seed/observability.index.ts /home/node/.openclaw/extensions/observability/index.ts
              cp /seed/observability.grafana.ts /home/node/.openclaw/extensions/observability/grafana.ts
              cp /seed/observability.openclaw.plugin.json /home/node/.openclaw/extensions/observability/openclaw.plugin.json
              cp /seed/observability.package.json /home/node/.openclaw/extensions/observability/package.json
              {{- end }}
              {{- if eq (include "mosaic-stack.bcmEnabled" .) "true" }}
              cp /seed/bcm.SKILL.md /home/node/.openclaw/workspace/skills/bcm/SKILL.md
              cp /seed/bcm.index.ts /home/node/.openclaw/extensions/bcm/index.ts
              cp /seed/bcm.openclaw.plugin.json /home/node/.openclaw/extensions/bcm/openclaw.plugin.json
              cp /seed/bcm.package.json /home/node/.openclaw/extensions/bcm/package.json
              {{- end }}
              rm -rf /home/node/.openclaw/workspace/.openclaw/sandbox-skills
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: openclaw-seed
              mountPath: /seed
        {{- if and (eq (include "mosaic-stack.bcmEnabled" .) "true") ($bcmDocs.enabled | default true) }}
        - name: init-bcm-docs
          image: {{ include "mosaic-stack.image" $bcmDocsImage | quote }}
          imagePullPolicy: {{ $bcmDocsImage.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache poppler-utils >/dev/null
              python /seed/bcm-docs-download.py
              rm -rf /home/node/.openclaw/workspace/skills/bcm/docs
              mkdir -p /home/node/.openclaw/workspace/skills/bcm/docs
              cp /home/node/.openclaw/workspace/bcm-docs/*.md /home/node/.openclaw/workspace/skills/bcm/docs/
              chown -R 1000:1000 /home/node/.openclaw/workspace/bcm-docs
              chown -R 1000:1000 /home/node/.openclaw/workspace/skills/bcm/docs
          env:
            - name: MOSAIC_BCM_DOCS_BASE_URL
              value: {{ $bcmDocs.baseUrl | quote }}
            - name: MOSAIC_BCM_DOCS_VERSION
              value: {{ $bcmDocs.version | quote }}
            - name: MOSAIC_BCM_DOCS_TIMEOUT_SECONDS
              value: {{ $bcmDocs.timeoutSeconds | quote }}
            - name: MOSAIC_BCM_DOCS_OUTPUT_DIR
              value: /home/node/.openclaw/workspace/bcm-docs
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: openclaw-seed
              mountPath: /seed
        {{- end }}
        - name: init-openshell-plugin
          image: {{ include "mosaic-stack.image" .Values.openclaw.image | quote }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              package=/app/node_modules/@openclaw/openshell-sandbox
              rm -rf /home/node/.openclaw/extensions/openshell
              mkdir -p /home/node/.openclaw/extensions/openshell/node_modules
              cp "$package/openclaw.plugin.json" /home/node/.openclaw/extensions/openshell/openclaw.plugin.json
              cp "$package/dist/index.js" /home/node/.openclaw/extensions/openshell/index.js
              node - <<'EOF'
              const fs = require("fs");
              const path = "/home/node/.openclaw/extensions/openshell/openclaw.plugin.json";
              const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
              manifest.id = "nemoclaw";
              manifest.name = "Nemoclaw Sandbox";
              fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
              EOF
              cat > /home/node/.openclaw/extensions/openshell/package.json <<'EOF'
              {"name":"@mosaic/nemoclaw-openshell","type":"module","version":"0.0.0","openclaw":{"extensions":["./index.js"]}}
              EOF
              ln -sfn "$package/node_modules/zod" /home/node/.openclaw/extensions/openshell/node_modules/zod
              node - <<'EOF'
              const fs = require("fs");
              const path = "/home/node/.openclaw/extensions/openshell/index.js";
              let source = fs.readFileSync(path, "utf8");
              source = source.replace(/\n    if \(api\.registrationMode !== "full"\) \{\n      return;\n    \}/, "");
              const imports = {
                "openclaw/plugin-sdk/core": "/app/dist/plugin-sdk/core.js",
                "openclaw/plugin-sdk/extension-shared": "/app/dist/plugin-sdk/extension-shared.js",
                "openclaw/plugin-sdk/file-access-runtime": "/app/dist/plugin-sdk/file-access-runtime.js",
                "openclaw/plugin-sdk/json-store": "/app/dist/plugin-sdk/json-store.js",
                "openclaw/plugin-sdk/number-runtime": "/app/dist/plugin-sdk/number-runtime.js",
                "openclaw/plugin-sdk/plugin-entry": "/app/dist/plugin-sdk/plugin-entry.js",
                "openclaw/plugin-sdk/sandbox": "/app/dist/plugin-sdk/sandbox.js",
                "openclaw/plugin-sdk/security-runtime": "/app/dist/plugin-sdk/security-runtime.js",
                "openclaw/plugin-sdk/string-coerce-runtime": "/app/dist/plugin-sdk/string-coerce-runtime.js"
              };
              for (const [from, to] of Object.entries(imports)) {
                source = source.split(`"${from}"`).join(`"${to}"`);
              }
              source = source.split('entries?.openshell?.config').join('entries?.nemoclaw?.config');
              source = source.split('id: "openshell"').join('id: "nemoclaw"');
              source = source.split('registerSandboxBackend("openshell"').join('registerSandboxBackend("nemoclaw"');
              source = source.replace('this.ensurePromise = null;\n\t\tthis.remoteSeedPending = false;', 'this.ensurePromise = null;\n\t\tthis.remoteSeedPending = true;');
              source = source.split("env: params.env").join("env: params.env");
              source = source.split('find \\"$1\\" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +').join('find \\"$1\\" -mindepth 1 -maxdepth 1 ! -name .openclaw -exec rm -rf -- {} +');
              source = source.split('rm -rf -- \"$1\" && mkdir -p -- \"$1\"').join('mkdir -p -- \"$1\" && find \"$1\" -mindepth 1 -maxdepth 1 ! -name .openclaw -exec rm -rf -- {} + 2>/dev/null || true');
              source = source.split('rm -rf -- "$1" && mkdir -p -- "$1"').join('mkdir -p -- "$1" && find "$1" -mindepth 1 -maxdepth 1 ! -name .openclaw -exec rm -rf -- {} + 2>/dev/null || true');
              source = source.split('find "$1" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +').join('find "$1" -mindepth 1 -maxdepth 1 ! -name .openclaw -exec rm -rf -- {} + 2>/dev/null || true');
              source = source.replace('import fs from "node:fs/promises";', 'import fs from "node:fs/promises";\nimport { spawn } from "node:child_process";');
              source = source.split('})).code === 0) return;').join('})).code === 0) {\n\t\t\tconst session = await createOpenShellSshSession({ context: this.params.execContext }).catch(() => null);\n\t\t\tif (session) {\n\t\t\t\ttry {\n\t\t\t\t\tconst probe = await runPluginCommandWithTimeout({ argv: ["ssh", "-F", session.configPath, "-T", "-o", "RequestTTY=no", session.host, "true"], cwd: this.params.createParams.workspaceDir, timeoutMs: 5e3, env: process.env });\n\t\t\t\t\tif (probe.code === 0) return;\n\t\t\t\t} finally {\n\t\t\t\t\tawait disposeSshSandboxSession(session);\n\t\t\t\t}\n\t\t\t}\n\t\t}');
              source = source.replace(
                "return await createSshSandboxSessionFromConfigText({ configText: applyGatewayEndpointToSshConfig({",
                "return await createSshSandboxSessionFromConfigText({ host: `openshell-${params.context.sandboxName}`, configText: applyGatewayEndpointToSshConfig({"
              );
              source = source.split('if (/(^|\\s)--server(\\s|=)|(^|\\s)--gateway-endpoint(\\s|=)/.test(command)) return line;').join('if (/(^|\\s)--server(\\s|=)|(^|\\s)--gateway-endpoint(\\s|=)|(^|\\s)--gateway-name(\\s|=)/.test(command)) return line;');
              source = source.replace(
                [
                  "\t\tconst createResult = await runOpenShellCli({",
                  "\t\t\tcontext: this.params.execContext,",
                  "\t\t\targs: createArgs,",
                  "\t\t\tcwd: this.params.createParams.workspaceDir,",
                  "\t\t\ttimeoutMs: Math.max(this.params.execContext.config.timeoutMs, 3e5)",
                  "\t\t});",
                  "\t\tif (createResult.code !== 0) throw new Error(createResult.stderr.trim() || \"openshell sandbox create failed\");",
                  "\t\tthis.remoteSeedPending = true;"
                ].join("\n"),
                [
                  "\t\tconst createProcess = spawn(resolveOpenShellCommand(this.params.execContext.config.command), [...buildOpenShellBaseArgv(this.params.execContext.config).slice(1), ...createArgs], {",
                  "\t\t\tcwd: this.params.createParams.workspaceDir,",
                  "\t\t\tenv: process.env,",
                  "\t\t\tdetached: true,",
                  "\t\t\tstdio: \"ignore\"",
                  "\t\t});",
                  "\t\tcreateProcess.unref();",
                  "\t\tfor (let attempt = 0; attempt < 120; attempt += 1) {",
                  "\t\t\tawait new Promise((resolve) => setTimeout(resolve, 1e3));",
                  "\t\t\tif ((await runOpenShellCli({",
                  "\t\t\t\tcontext: this.params.execContext,",
                  "\t\t\t\targs: [\"sandbox\", \"get\", this.params.execContext.sandboxName],",
                  "\t\t\t\tcwd: this.params.createParams.workspaceDir",
                  "\t\t\t})).code === 0) {",
                  "\t\t\t\tconst session = await createOpenShellSshSession({ context: this.params.execContext }).catch(() => null);",
                  "\t\t\t\tif (session) {",
                  "\t\t\t\t\ttry {",
                  "\t\t\t\t\t\tconst probe = await runPluginCommandWithTimeout({",
                  "\t\t\t\t\t\t\targv: [\"ssh\", \"-F\", session.configPath, \"-T\", \"-o\", \"RequestTTY=no\", session.host, \"true\"],",
                  "\t\t\t\t\t\t\tcwd: this.params.createParams.workspaceDir,",
                  "\t\t\t\t\t\t\ttimeoutMs: 5e3,",
                  "\t\t\t\t\t\t\tenv: process.env",
                  "\t\t\t\t\t\t});",
                  "\t\t\t\t\t\tif (probe.code === 0) {",
                  "\t\t\t\t\t\t\tthis.remoteSeedPending = true;",
                  "\t\t\t\t\t\t\treturn;",
                  "\t\t\t\t\t\t}",
                  "\t\t\t\t\t} finally {",
                  "\t\t\t\t\t\tawait disposeSshSandboxSession(session);",
                  "\t\t\t\t\t}",
                  "\t\t\t\t}",
                  "\t\t\t}",
                  "\t\t}",
                  "\t\tthrow new Error(\"openshell sandbox create timed out\");"
                ].join("\n")
              );
              fs.writeFileSync(path, source);
              EOF
              config_root=/home/node/.openclaw/.config/openshell
              gateway_endpoint={{ include "mosaic-stack.openshellGatewayEndpoint" . | quote }}
              metadata_path="$config_root/gateways/$gateway_endpoint/metadata.json"
              mkdir -p "$(dirname "$metadata_path")"
              printf "%s" "$gateway_endpoint" > "$config_root/active_gateway"
              node - "$metadata_path" "$gateway_endpoint" <<'EOF'
              const fs = require("fs");
              const path = require("path");
              const [metadataPath, endpoint] = process.argv.slice(2);
              fs.mkdirSync(path.dirname(metadataPath), { recursive: true });
              fs.writeFileSync(metadataPath, JSON.stringify({
                name: endpoint,
                gateway_endpoint: endpoint,
                is_remote: false,
                gateway_port: 0,
                auth_mode: "plaintext"
              }, null, 2));
              EOF
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
      containers:
        - name: gateway
          image: {{ include "mosaic-stack.image" .Values.openclaw.image | quote }}
          imagePullPolicy: {{ .Values.openclaw.image.pullPolicy }}
          command: ["node", "/app/dist/index.js", "gateway", "run"]
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: XDG_CONFIG_HOME
              value: /home/node/.openclaw/.config
            - name: KUBECONFIG
              value: /home/node/.openclaw/kubeconfig
            - name: NODE_ENV
              value: production
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openclaw.secrets.name }}
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: VLLM_API_KEY
              {{- if and (eq .Values.llm.mode "external") .Values.llm.external.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.external.existingSecret }}
                  key: {{ .Values.llm.external.apiKeySecretKey }}
              {{- else }}
              value: local-vllm
              {{- end }}
            - name: OPENCLAW_VLLM_BASE_URL
              value: {{ include "mosaic-stack.llmBaseUrl" . | quote }}
            - name: MOSAIC_PROMETHEUS_URL
              value: {{ default "http://prometheus.mosaic-observability.svc.cluster.local:9090" $observability.prometheusUrl | quote }}
            - name: MOSAIC_GRAFANA_URL
              value: {{ default "http://grafana.mosaic-observability.svc.cluster.local:3000" $observability.grafanaUrl | quote }}
            - name: MOSAIC_UI_URL
              value: {{ printf "http://mosaic-ui.%s.svc.cluster.local:3000" .Release.Namespace | quote }}
            - name: MOSAIC_SLURM_EVIDENCE_URL
              value: {{ printf "http://slurm-evidence-collector.%s.svc.cluster.local:%v" .Release.Namespace (default 8080 .Values.slurmEvidenceCollector.port) | quote }}
          ports:
            - containerPort: 18789
              name: gateway
          readinessProbe:
            exec:
              command: ["node", "-e", "require(\"http\").get(\"http://127.0.0.1:18789/readyz\", r => process.exit(r.statusCode < 400 ? 0 : 1)).on(\"error\", () => process.exit(1))"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["node", "-e", "require(\"http\").get(\"http://127.0.0.1:18789/healthz\", r => process.exit(r.statusCode < 400 ? 0 : 1)).on(\"error\", () => process.exit(1))"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: openclaw-home
              mountPath: /tmp
              subPath: tmp
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: openclaw-home-pvc
        - name: openclaw-seed
          configMap:
            name: openclaw-seed
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  labels:
    app: openclaw
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: openclaw
  ports:
    - name: gateway
      port: {{ .Values.openclaw.service.port }}
      targetPort: gateway
  type: ClusterIP
{{- end }}
