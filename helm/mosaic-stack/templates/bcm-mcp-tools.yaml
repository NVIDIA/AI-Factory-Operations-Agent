{{- if .Values.bcmMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.bcmMcp.service.name }}
  labels:
    app: {{ .Values.bcmMcp.service.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.bcmMcp.service.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.bcmMcp.service.name }}
    spec:
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" . | nindent 6 }}
      {{- if .Values.bcmMcp.hostSshKeySecretName }}
      initContainers:
        - name: init-bcm-ssh
          image: {{ include "mosaic-stack.image" .Values.mosaicTerminal.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.mosaicTerminal.busyboxImage.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /root-ssh
              cp /etc/ssh-keys/id_ecdsa /root-ssh/id_ecdsa
              chmod 600 /root-ssh/id_ecdsa
              {
                printf '%s\n' 'Host *'
                printf '%s\n' '  IdentityFile /root/.ssh/id_ecdsa'
                printf '%s\n' '  StrictHostKeyChecking accept-new'
                printf '%s\n' '  UserKnownHostsFile /root/.ssh/known_hosts'
              } > /root-ssh/config
              chmod 600 /root-ssh/config
          volumeMounts:
            - name: bcm-host-ssh-key
              mountPath: /etc/ssh-keys
              readOnly: true
            - name: bcm-ssh-dir
              mountPath: /root-ssh
      {{- end }}
      containers:
        - name: bcm-mcp
          image: {{ include "mosaic-stack.image" .Values.bcmMcp.image | quote }}
          imagePullPolicy: {{ .Values.bcmMcp.image.pullPolicy }}
          command: ["bcm-support-mcp"]
          args:
            - --no-ssl
            - --no-auth
            {{- if .Values.bcmMcp.config.noCmshUser }}
            - --no-cmsh-user
            {{- end }}
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.bcmMcp.service.port | quote }}
            - --exec-timeout
            - {{ .Values.bcmMcp.config.execTimeout | quote }}
            - --max-output-lines
            - {{ .Values.bcmMcp.config.maxOutputLines | quote }}
            - --max-output-chars
            - {{ .Values.bcmMcp.config.maxOutputChars | quote }}
            - --preloaded-modules
            - {{ .Values.bcmMcp.config.preloadedModules | quote }}
          env:
            - name: MCP_CONFIG_DIR
              value: /tmp/bcm-mcp-tools
            - name: MCP_NOTES_DIR
              value: /tmp/bcm-mcp-notes
          ports:
            - containerPort: {{ .Values.bcmMcp.service.port }}
              name: http
          {{- if .Values.bcmMcp.hostSshKeySecretName }}
          volumeMounts:
            - name: bcm-ssh-dir
              mountPath: /root/.ssh
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
{{ toYaml .Values.bcmMcp.resources | indent 12 }}
      {{- if .Values.bcmMcp.hostSshKeySecretName }}
      volumes:
        - name: bcm-host-ssh-key
          secret:
            secretName: {{ .Values.bcmMcp.hostSshKeySecretName }}
            defaultMode: 0400
        - name: bcm-ssh-dir
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.bcmMcp.service.name }}
  labels:
    app: {{ .Values.bcmMcp.service.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.bcmMcp.service.name }}
  ports:
    - name: http
      port: {{ .Values.bcmMcp.service.port }}
      targetPort: http
  type: ClusterIP
{{- end }}
