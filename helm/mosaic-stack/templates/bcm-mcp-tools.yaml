{{- if and .Values.modules.bcm.enabled .Values.bcmMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.bcmMcp.service.name }}
  labels:
    app: {{ .Values.bcmMcp.service.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.bcmMcp.service.name }}
  template:
    metadata:
      annotations:
        checksum/bcm-ssh-adapter-http: {{ .Files.Get "files/bcm-mcp-ssh-adapter-http.py" | sha256sum }}
        checksum/bcm-auth-config: {{ printf "%s:%s:%s" .Values.bcmMcp.authTokenSecretName .Values.bcmMcp.authTokenSecretKey .Values.bcmMcp.authToken | sha256sum }}
      labels:
        app: {{ .Values.bcmMcp.service.name }}
    spec:
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" . | nindent 6 }}
      {{- include "mosaic-stack.tolerations" . | nindent 6 }}
      {{- if .Values.bcmMcp.hostSshKeySecretName }}
      initContainers:
        - name: init-bcm-ssh
          image: {{ include "mosaic-stack.image" .Values.bcmMcp.busyboxImage | quote }}
          imagePullPolicy: {{ .Values.bcmMcp.busyboxImage.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /root-ssh
              cp /etc/ssh-keys/id_ecdsa /root-ssh/id_ecdsa
              chmod 600 /root-ssh/id_ecdsa
              {
                printf '%s\n' 'Host *'
                printf '%s\n' '  IdentityFile /root/.ssh/id_ecdsa'
                printf '%s\n' '  StrictHostKeyChecking accept-new'
                printf '%s\n' '  UserKnownHostsFile /root/.ssh/known_hosts'
              } > /root-ssh/config
              chmod 600 /root-ssh/config
          volumeMounts:
            - name: bcm-host-ssh-key
              mountPath: /etc/ssh-keys
              readOnly: true
            - name: bcm-ssh-dir
              mountPath: /root-ssh
      {{- end }}
      containers:
        - name: bcm-mcp
          image: {{ include "mosaic-stack.image" .Values.bcmMcp.image | quote }}
          imagePullPolicy: {{ .Values.bcmMcp.image.pullPolicy }}
          {{- if eq .Values.bcmMcp.mode "ssh-adapter" }}
          command: ["python"]
          args: ["/opt/mosaic/bcm-mcp-ssh-adapter-http.py"]
          {{- else }}
          command: ["bcm-support-mcp"]
          args:
            - --no-ssl
            - --no-auth
            {{- if .Values.bcmMcp.config.noCmshUser }}
            - --no-cmsh-user
            {{- end }}
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.bcmMcp.service.port | quote }}
            - --exec-timeout
            - {{ .Values.bcmMcp.config.execTimeout | quote }}
            - --max-output-lines
            - {{ .Values.bcmMcp.config.maxOutputLines | quote }}
            - --max-output-chars
            - {{ .Values.bcmMcp.config.maxOutputChars | quote }}
            - --preloaded-modules
            - {{ .Values.bcmMcp.config.preloadedModules | quote }}
          {{- end }}
          env:
            - name: MCP_CONFIG_DIR
              value: /tmp/bcm-mcp-tools
            - name: MCP_NOTES_DIR
              value: /tmp/bcm-mcp-notes
            {{- if eq .Values.bcmMcp.mode "ssh-adapter" }}
            - name: MOSAIC_BCM_ADAPTER_HOST
              value: "0.0.0.0"
            - name: MOSAIC_BCM_ADAPTER_PORT
              value: {{ .Values.bcmMcp.service.port | quote }}
            - name: MCP_SSH_INSTALL_SERVER
              value: {{ .Values.bcmMcp.config.installServer | quote }}
            - name: MCP_SSH_REMOTE_COMMAND
              value: {{ .Values.bcmMcp.config.remoteCommand | quote }}
            - name: MCP_SSH_OPTIONS
              value: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/root/.ssh/known_hosts"
            - name: MOSAIC_BCM_CMSH_ENABLED
              value: {{ ternary "false" "true" .Values.bcmMcp.config.noCmshUser | quote }}
            - name: MOSAIC_BCM_CMSH_ADMIN_ENABLED
              value: {{ and .Values.modules.edit.enabled .Values.modules.edit.bcm.enabled | quote }}
            - name: MOSAIC_BCM_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bcmMcp.authTokenSecretName }}
                  key: {{ .Values.bcmMcp.authTokenSecretKey }}
            - name: MOSAIC_BCM_CMSH_USERNAME
              value: {{ .Values.bcmMcp.config.cmshUsername | default "aichatbotuser" | quote }}
            - name: MOSAIC_BCM_CMSH_PROFILE
              value: {{ .Values.bcmMcp.config.cmshProfile | default "readonly" | quote }}
            - name: MOSAIC_BCM_CMSH_SETUP_TIMEOUT
              value: {{ .Values.bcmMcp.config.cmshSetupTimeout | default "240" | quote }}
            - name: MOSAIC_BCM_CMSH_EXEC_TIMEOUT
              value: {{ .Values.bcmMcp.config.cmshExecTimeout | default "120" | quote }}
            - name: MOSAIC_BCM_CMSH_PATH
              value: {{ .Values.bcmMcp.config.cmshPath | default "/cm/local/apps/cmd/bin/cmsh" | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.bcmMcp.service.port }}
              name: http
          {{- if .Values.bcmMcp.hostSshKeySecretName }}
          volumeMounts:
            - name: bcm-ssh-dir
              mountPath: /root/.ssh
            {{- if eq .Values.bcmMcp.mode "ssh-adapter" }}
            - name: bcm-ssh-adapter-http
              mountPath: /opt/mosaic/bcm-mcp-ssh-adapter-http.py
              subPath: bcm-mcp-ssh-adapter-http.py
            {{- end }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
{{ toYaml .Values.bcmMcp.resources | indent 12 }}
      {{- if .Values.bcmMcp.hostSshKeySecretName }}
      volumes:
        - name: bcm-host-ssh-key
          secret:
            secretName: {{ .Values.bcmMcp.hostSshKeySecretName }}
            defaultMode: 0400
        - name: bcm-ssh-dir
          emptyDir: {}
        {{- if eq .Values.bcmMcp.mode "ssh-adapter" }}
        - name: bcm-ssh-adapter-http
          configMap:
            name: {{ .Values.bcmMcp.service.name }}-ssh-adapter-http
            defaultMode: 0555
        {{- end }}
      {{- end }}
---
{{- if eq .Values.bcmMcp.mode "ssh-adapter" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.bcmMcp.service.name }}-ssh-adapter-http
  labels:
    app: {{ .Values.bcmMcp.service.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
data:
  bcm-mcp-ssh-adapter-http.py: |-
{{ .Files.Get "files/bcm-mcp-ssh-adapter-http.py" | indent 4 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.bcmMcp.service.name }}
  labels:
    app: {{ .Values.bcmMcp.service.name }}
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.bcmMcp.service.name }}
  ports:
    - name: http
      port: {{ .Values.bcmMcp.service.port }}
      targetPort: http
  type: ClusterIP
{{- end }}
