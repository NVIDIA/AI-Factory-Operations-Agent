{{- range $name, $config := .Values.managedMcpServers.servers }}
{{- if $config.enabled }}
{{- $server := mergeOverwrite (deepCopy $.Values.managedMcpServers.defaults) $config }}
{{- $resourceName := printf "mcp-%s" $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName }}
  labels:
    app: {{ $resourceName }}
    {{- include "mosaic-stack.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $resourceName }}
  template:
    metadata:
      {{- if $server.oauth.enabled }}
      annotations:
        checksum/oauth-proxy: {{ $.Files.Get "files/mcp-oauth-proxy.mjs" | sha256sum }}
      {{- end }}
      labels:
        app: {{ $resourceName }}
    spec:
      automountServiceAccountToken: false
      {{- include "mosaic-stack.imagePullSecrets" $ | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" $ | nindent 6 }}
      {{- include "mosaic-stack.tolerations" $ | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $resourceName }}
          image: {{ include "mosaic-stack.image" $server.image | quote }}
          imagePullPolicy: {{ $server.image.pullPolicy }}
          {{- with $server.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $server.env $server.secretEnv $server.tls.existingSecret }}
          env:
            {{- range $envName, $value := $server.env }}
            - name: {{ $envName }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $envName, $secret := $server.secretEnv }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.name | quote }}
                  key: {{ $secret.key | quote }}
            {{- end }}
            {{- if $server.tls.existingSecret }}
            - name: {{ $server.tls.envName }}
              value: {{ $server.tls.mountPath | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: {{ ternary "upstream" "mcp" $server.oauth.enabled }}
              containerPort: {{ $server.port }}
          readinessProbe:
            tcpSocket:
              port: {{ ternary "upstream" "mcp" $server.oauth.enabled }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ ternary "upstream" "mcp" $server.oauth.enabled }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          {{- if $server.tls.existingSecret }}
          volumeMounts:
            - name: server-ca
              mountPath: {{ $server.tls.mountPath | quote }}
              subPath: {{ $server.tls.key | quote }}
              readOnly: true
          {{- end }}
        {{- if $server.oauth.enabled }}
        - name: oauth
          image: {{ include "mosaic-stack.image" $.Values.mosaicUi.image | quote }}
          command: ["node", "/oauth/proxy.mjs"]
          env:
            - name: PORT
              value: {{ add1 (int $server.port) | quote }}
            - name: UPSTREAM_PORT
              value: {{ $server.port | quote }}
            - name: MCP_PATH
              value: {{ $server.path | quote }}
            - name: OAUTH_TOKEN_URL
              value: {{ $server.oauth.tokenUrl | quote }}
            - name: OAUTH_SCOPE
              value: {{ $server.oauth.scope | quote }}
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef: {{ toJson $server.oauth.clientIdSecret }}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {{ toJson $server.oauth.clientSecretSecret }}
            {{- if $server.tls.existingSecret }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ $server.tls.mountPath | quote }}
            {{- end }}
          ports:
            - name: mcp
              containerPort: {{ add1 (int $server.port) }}
          readinessProbe:
            httpGet: {path: /healthz, port: mcp}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: oauth-proxy
              mountPath: /oauth
              readOnly: true
            {{- if $server.tls.existingSecret }}
            - name: server-ca
              mountPath: {{ $server.tls.mountPath | quote }}
              subPath: {{ $server.tls.key | quote }}
              readOnly: true
            {{- end }}
        {{- end }}
      {{- if or $server.tls.existingSecret $server.oauth.enabled }}
      volumes:
        {{- if $server.oauth.enabled }}
        - name: oauth-proxy
          configMap:
            name: {{ $resourceName }}-oauth
        {{- end }}
        {{- if $server.tls.existingSecret }}
        - name: server-ca
          secret:
            secretName: {{ $server.tls.existingSecret | quote }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $resourceName }}
  labels:
    app: {{ $resourceName }}
    {{- include "mosaic-stack.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $resourceName }}
  ports:
    - name: mcp
      port: {{ $server.port }}
      targetPort: mcp
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $resourceName }}
  labels:
    app: {{ $resourceName }}
    {{- include "mosaic-stack.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ $resourceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: openclaw
      ports:
        - protocol: TCP
          port: {{ ternary (add1 (int $server.port)) (int $server.port) $server.oauth.enabled }}
---
{{- if $server.oauth.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $resourceName }}-oauth
data:
  proxy.mjs: |
{{ $.Files.Get "files/mcp-oauth-proxy.mjs" | indent 4 }}
---
{{- end }}
{{- end }}
{{- end }}
