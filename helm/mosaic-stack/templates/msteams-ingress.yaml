{{- if and .Values.modules.execution.enabled .Values.openclaw.enabled .Values.openclaw.msteams.enabled .Values.openclaw.msteams.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw-msteams
  labels:
    {{- include "mosaic-stack.labels" . | nindent 4 }}
  {{- with .Values.openclaw.msteams.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.openclaw.msteams.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.openclaw.msteams.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $.Values.openclaw.msteams.ingress.host | quote }}
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.openclaw.msteams.ingress.host | quote }}
      http:
        paths:
          - path: /api/messages
            pathType: Exact
            backend:
              service:
                name: openclaw
                port:
                  name: msteams
{{- end }}
