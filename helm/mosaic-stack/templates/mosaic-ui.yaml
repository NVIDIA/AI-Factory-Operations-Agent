{{- if and .Values.modules.ui.enabled .Values.mosaicUi.enabled }}
{{- $observability := default dict .Values.observability }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-ui
  labels:
    app: mosaic-ui
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mosaicUi.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosaic-ui
  template:
    metadata:
      labels:
        app: mosaic-ui
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/openclaw-seed-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" . | nindent 6 }}
      containers:
        - name: mosaic-ui
          image: {{ include "mosaic-stack.image" .Values.mosaicUi.image | quote }}
          imagePullPolicy: {{ .Values.mosaicUi.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_MOSAIC_DEPLOYMENT_VERSION
              value: {{ .Values.mosaicUi.deploymentVersion | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MOSAIC_OPENCLAW_DEPLOYMENT
              value: openclaw
            - name: MOSAIC_OPENCLAW_PROTOCOL
              value: {{ .Values.openclaw.gatewayProtocol | quote }}
            {{- if and .Values.modules.execution.enabled .Values.openclaw.enabled }}
            - name: MOSAIC_OPENCLAW_GATEWAY_URL
              value: {{ printf "ws://openclaw:%v" .Values.openclaw.service.port | quote }}
            - name: MOSAIC_OPENCLAW_GATEWAY_HTTP_URL
              value: {{ printf "http://openclaw:%v" .Values.openclaw.service.port | quote }}
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openclaw.secrets.name }}
                  key: OPENCLAW_GATEWAY_TOKEN
            {{- end }}
            - name: MOSAIC_AUDIT_DIR
              value: /var/lib/mosaic-audit
            - name: MOSAIC_DASHBOARD_DIR
              value: /var/lib/mosaic-audit/dashboard
            - name: MOSAIC_PROMETHEUS_URL
              value: {{ default "http://prometheus.mosaic-observability.svc.cluster.local:9090" $observability.prometheusUrl | quote }}
            - name: MOSAIC_GRAFANA_URL
              value: {{ default "http://grafana.mosaic-observability.svc.cluster.local:3000" $observability.grafanaUrl | quote }}
            - name: MOSAIC_GRAFANA_UPSTREAM_PREFIX
              value: {{ default "/api/grafana/proxy" $observability.grafanaUpstreamPrefix | quote }}
            {{- with $observability.grafanaAuth.existingSecret }}
            - name: MOSAIC_GRAFANA_BASIC_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $observability.grafanaAuth.usernameKey }}
            - name: MOSAIC_GRAFANA_BASIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $observability.grafanaAuth.passwordKey }}
            {{- end }}
            - name: MOSAIC_ALERTMANAGER_URL
              value: {{ printf "http://kube-prometheus-stack-alertmanager.%s.svc.cluster.local:9093" .Values.global.alertmanagerNamespace | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: audit-log
              mountPath: /var/lib/mosaic-audit
      volumes:
        - name: audit-log
          persistentVolumeClaim:
            claimName: mosaic-audit-log
---
apiVersion: v1
kind: Service
metadata:
  name: mosaic-ui
  labels:
    app: mosaic-ui
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: mosaic-ui
  ports:
    - name: http
      port: {{ .Values.mosaicUi.service.port }}
      targetPort: http
  type: ClusterIP
{{- end }}
