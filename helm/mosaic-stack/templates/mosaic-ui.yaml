{{- if and .Values.modules.ui.enabled .Values.mosaicUi.enabled }}
{{- $observability := default dict .Values.observability }}
{{- $sessionAccessPlugins := list "automation-guard" }}
{{- if .Values.modules.kubernetes.enabled }}
{{- $sessionAccessPlugins = append $sessionAccessPlugins "kubernetes" }}
{{- end }}
{{- if eq (include "mosaic-stack.bcmEnabled" .) "true" }}
{{- $sessionAccessPlugins = append $sessionAccessPlugins "bcm" }}
{{- end }}
{{- if and .Values.modules.edit.enabled .Values.modules.edit.ssh.enabled }}
{{- $sessionAccessPlugins = append $sessionAccessPlugins "remote-ssh" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-ui
  labels:
    app: mosaic-ui
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mosaicUi.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosaic-ui
  template:
    metadata:
      labels:
        app: mosaic-ui
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/openclaw-seed-configmap.yaml") . | sha256sum }}
        checksum/auth: {{ include (print $.Template.BasePath "/mosaic-ui-auth-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      {{- include "mosaic-stack.imagePullSecrets" . | nindent 6 }}
      {{- include "mosaic-stack.nodeSelector" . | nindent 6 }}
      {{- include "mosaic-stack.tolerations" . | nindent 6 }}
      containers:
        - name: mosaic-ui
          image: {{ include "mosaic-stack.image" .Values.mosaicUi.image | quote }}
          imagePullPolicy: {{ .Values.mosaicUi.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: MOSAIC_UI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.mosaicUi.auth.name .Values.mosaicUi.auth.existingSecret }}
                  key: username
            - name: MOSAIC_UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.mosaicUi.auth.name .Values.mosaicUi.auth.existingSecret }}
                  key: password
            - name: NEXT_PUBLIC_MOSAIC_DEPLOYMENT_VERSION
              value: {{ .Values.mosaicUi.deploymentVersion | quote }}
            - name: MOSAIC_TERMINAL_ENABLED
              value: {{ .Values.modules.terminal.enabled | quote }}
            - name: MOSAIC_EDIT_ENABLED
              value: {{ .Values.modules.edit.enabled | quote }}
            - name: MOSAIC_EDIT_HITL
              value: {{ .Values.modules.edit.hitl | quote }}
            - name: MOSAIC_SESSION_ACCESS_PLUGINS
              value: {{ join "," $sessionAccessPlugins | quote }}
            - name: MOSAIC_CLUSTERS_ENABLED
              value: {{ .Values.modules.clusters.enabled | quote }}
            {{- if .Values.modules.clusters.enabled }}
            - name: MOSAIC_CLUSTER_MONITOR_URL
              value: {{ printf "http://mosaic-cluster-monitor:%v" .Values.mosaicClusterMonitor.service.port | quote }}
            - name: MOSAIC_AUTOMATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.mosaicClusterMonitor.auth.name .Values.mosaicClusterMonitor.auth.existingSecret }}
                  key: token
            {{- end }}
            {{- if .Values.modules.terminal.enabled }}
            - name: MOSAIC_TERMINAL_URL
              value: {{ printf "http://mosaic-terminal:%v" .Values.mosaicTerminal.service.port | quote }}
            - name: MOSAIC_TERMINAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.mosaicTerminal.auth.name .Values.mosaicTerminal.auth.existingSecret }}
                  key: token
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MOSAIC_OPENCLAW_DEPLOYMENT
              value: openclaw
            - name: MOSAIC_OPENCLAW_PROTOCOL
              value: {{ .Values.openclaw.gatewayProtocol | quote }}
            {{- if .Values.modules.research.managed }}
            - name: MOSAIC_IRAOP_BASE_URL
              value: "http://iraop:8000"
            - name: MOSAIC_IRAOP_CORPUS_DIR
              value: {{ .Values.researchAgent.iraop.config.CORPUS_DIR | quote }}
            - name: MOSAIC_IRAOP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.researchAgent.iraop.secretName }}
                  key: IRAOP_API_KEY
            {{- end }}
            {{- if and .Values.modules.execution.enabled .Values.openclaw.enabled }}
            - name: MOSAIC_OPENCLAW_GATEWAY_URL
              value: {{ printf "ws://openclaw:%v" .Values.openclaw.service.port | quote }}
            - name: MOSAIC_OPENCLAW_GATEWAY_HTTP_URL
              value: {{ printf "http://openclaw:%v" .Values.openclaw.service.port | quote }}
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openclaw.secrets.name }}
                  key: OPENCLAW_GATEWAY_TOKEN
            {{- end }}
            - name: MOSAIC_AUDIT_DIR
              value: /var/lib/mosaic-audit
            - name: MOSAIC_DASHBOARD_DIR
              value: /var/lib/mosaic-audit/dashboard
            - name: MOSAIC_PROMETHEUS_URL
              value: {{ $observability.prometheusUrl | quote }}
            - name: MOSAIC_GRAFANA_URL
              value: {{ $observability.grafanaUrl | quote }}
            {{- with $observability.grafanaAuth.existingSecret }}
            - name: MOSAIC_GRAFANA_BASIC_USER
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $observability.grafanaAuth.usernameKey }}
            - name: MOSAIC_GRAFANA_BASIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $observability.grafanaAuth.passwordKey }}
            {{- end }}
            - name: MOSAIC_ALERTMANAGER_URL
              value: {{ $observability.alertmanagerUrl | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: audit-log
              mountPath: /var/lib/mosaic-audit
            {{- if .Values.modules.research.managed }}
            - name: research-corpus
              mountPath: {{ .Values.researchAgent.iraop.config.CORPUS_DIR }}
            {{- end }}
      volumes:
        - name: audit-log
          persistentVolumeClaim:
            claimName: mosaic-audit-log
        {{- if .Values.modules.research.managed }}
        - name: research-corpus
          hostPath:
            path: {{ .Values.researchAgent.iraop.corpus.hostPath }}
            type: Directory
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mosaic-ui
  labels:
    app: mosaic-ui
    {{- include "mosaic-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: mosaic-ui
  ports:
    - name: http
      port: {{ .Values.mosaicUi.service.port }}
      targetPort: http
  type: ClusterIP
{{- end }}
