  enabled: true
  gatewayProtocol: 4
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: 2026.6.6
    pullPolicy: IfNotPresent
  opensshInstallerImage: alpine/git@sha256:e043be20669db13cbcfb6190192babee4cf2dca98709bb0c2d08ca2d35a0a06a
  pvc:
    size: 10Gi
    storageClassName: local-path
  secrets:
    create: true
    name: openclaw-secrets
    gatewayToken: ""
  openshell:
    command: /tools/openshell
    gateway: ""
    gatewayEndpoint: ""
    policy: ""
    cliVersion: v0.0.75
    cliSha256:
      amd64: 9b9331644d0b6350030c521047490314b594591547b4ca28ef105b7adad73eb8
      arm64: c7bf758ed864ef375ba3358d39b4d6e4b80da9e451b67a47ae1341df82c362e0
    pluginVersion: 2026.6.6
    pluginSha256: 1e0cbbcf105e931b6dc19c9411de73dcf65e76a111e3f41ffde379e8855caa33
  service:
    port: 18789

openshell:
  nameOverride: ""
  fullnameOverride: ""
  image:
    repository: ghcr.io/nvidia/openshell/gateway
    tag: 0.0.75
    pullPolicy: IfNotPresent
  supervisor:
    image:
      repository: ghcr.io/nvidia/openshell/supervisor
      tag: 0.0.75
      pullPolicy: IfNotPresent
    sideloadMethod: init-container
  networkPolicy:
    enabled: false
  pkiInitJob:
    enabled: true
  server:
    dbUrl: sqlite:/tmp/openshell.db
    disableTls: false
    auth:
      allowUnauthenticatedUsers: true
    tls:
      clientTlsSecretName: openshell-client-tls
    sshGatewayHost: ""
    sshGatewayPort: 8080
    sandboxImage: ghcr.io/nvidia/openshell-community/sandboxes/base@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e
    sandboxImagePullPolicy: IfNotPresent

slurmEvidenceCollector:
  image:
    repository: node
    tag: 20-bookworm-slim
    pullPolicy: IfNotPresent
  port: 8080
  maxFileBytes: 65536
  maxMatches: 40
  maxVisitedFiles: 50000
  nodeSelector: {}
  roots:
    - /var/log
    - /cm/shared
    - /slurm
    - /etc/slurm
    - /cm/shared/apps/slurm/etc
    - /run/log/journal
    - /var/log/journal

bcmMcp:
  enabled: false
  mode: direct
  mcpUrl: http://bcm-mcp-tools:3001/mcp
  headHost: ""
  authTokenCreate: true
  authTokenSecretName: bcm-mcp-auth
  authTokenSecretKey: BCM_MCP_TOKEN
  authToken: ""
  hostSshKeySecretName: ""
  service:
    name: bcm-mcp-tools
    port: 3001
  image:
    repository: nvcr.io/0948643769302270/bcm-mcp-tools
    tag: 0b0cb309
    pullPolicy: IfNotPresent
  busyboxImage:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  config:
    execTimeout: "120"
    maxOutputLines: "200"
    maxOutputChars: "20000"
    preloadedModules: "shared,slurm"
    noCmshUser: false
    cmshUsername: aichatbotuser
    cmshProfile: readonly
    cmshSetupTimeout: "240"
    cmshExecTimeout: "120"
    cmshPath: /cm/local/apps/cmd/bin/cmsh
    installServer: auto
    remoteCommand: bcm-support-mcp --stdio --no-cmsh-user --preloaded-modules shared,slurm
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mosaicTerminal:
  service:
    port: 3002
  idleTimeoutMs: 1800000
  auth:
    create: true
    name: mosaic-terminal-auth
    existingSecret: ""
    token: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

mosaicClusterMonitor:
  service:
    port: 3003
  auth:
    create: true
    name: mosaic-cluster-monitor-auth
    existingSecret: ""
    token: ""
  persistence:
    size: 1Gi
    storageClassName: ""
  historyLimit: 10
  timeoutMs: 600000
  defaultIntervalHours: 24
  bcm:
    enabled: true
    id: bcm
    name: BCM Cluster
  kubernetes:
    enabled: true
    localName: Local Kubernetes
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

diagnosticAgent:
  enabled: true
  image:
    repository: nvcr.io/0948643769302270/diagnostic-agent
    tag: mosaic-sidecar-fulltext-202605071437
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  hostSshKeySecretName: bcm-host-ssh-key
  playbooksConfigMapName: debughub-playbooks-tar
  bcmWebhookSecretName: bcm-webhook-creds
  config:
    nvdebugTimeoutSeconds: "1800"
    bcmWebhookTimeoutSeconds: "60"
    inferenceBackend: nvidia_api
    inferenceApiKey: dummy
    reasoningRequireFindingsMatch: "false"
    mosaicAlertMinConfidence: low
    nvdebugSpreadsheetPath: /opt/nvdebug-release/config/Telemetry_Catalog_v4.1.xlsx
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: "8"
      memory: 32Gi
  existingSecrets:
    - diagnostic-agent-secrets
    - bcm-webhook-creds
    - diagnostic-agent-api-keys
  secrets:
    create: false
    apiKeys: ""
    bcmWebhookUrl: ""
    bcmWebhookToken: ""
    env: {}
    hostSshPrivateKey: ""
    playbooksTgzBase64: ""

bcmDocs:
