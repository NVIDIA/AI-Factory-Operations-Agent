global:
  imagePullSecrets: []
  registryCredentials:
    create: false
    name: nvcr-image-pull-secret
    server: nvcr.io
    username: "$oauthtoken"
    password: ""
    email: unused@example.com
  nodeSelector: {}
  tolerations: []
  alertmanagerNamespace: prometheus

namespace:
  labels: {}

observability:
  prometheusUrl: http://prometheus.mosaic-observability.svc.cluster.local:9090
  grafanaUrl: http://grafana.mosaic-observability.svc.cluster.local:3000/api/grafana/proxy
  grafanaDatasourceUid: mosaic-observability-prometheus
  grafanaAuth:
    existingSecret: ""
    usernameKey: username
    passwordKey: password

agentSandbox:
  install: true

modules:
  ui:
    enabled: true
  execution:
    enabled: true
  kubernetes:
    enabled: true
  observability:
    enabled: true
  grafana:
    enabled: true
  bcm:
    enabled: true
  slurm:
    enabled: true
    backend: auto
    evidenceCollector:
      enabled: true
  diagnostics:
    enabled: false
  research:
    enabled: false
    managed: false
    baseUrl: http://iraop:8000/mcp/sse
    timeoutMs: 240000
    secrets:
      create: false
      nvidiaApiKey: ""
      chatApiKey: EMPTY
  terminal:
    enabled: false
  clusters:
    enabled: false
  edit:
    enabled: false
    hitl: true
    approvalTimeoutMs: 120000
    kubernetes:
      enabled: true
      existingClusterRole: ""
    bcm:
      enabled: false
    ssh:
      enabled: false
      existingSecret: ""
      privateKeyKey: privateKey
      knownHostsKey: knownHosts
      timeoutMs: 60000
      maxOutputBytes: 65536
      hosts: []

kubernetes:
  defaultCluster: local
  local:
    enabled: true
  command: /tools/kubectl
  timeoutMs: 60000
  maxOutputBytes: 1048576
  kubectlVersion: v1.34.1
  kubectlSha256:
    amd64: 7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3
    arm64: 420e6110e3ba7ee5a3927b5af868d18df17aae36b720529ffa4e9e945aa95450
  clusters: []

llm:
  mode: vllm
  requestCompatibility:
    enabled: true
    name: llm-openai-compat
    port: 8000
    disableThinking: true
  external:
    baseUrl: ""
    model: ""
    existingSecret: ""
    apiKeySecretKey: apiKey
  vllm:
    profile: ultra-16gpu
    name: vllm-nemotron
    replicaCount: 1
    image:
      repository: vllm/vllm-openai
      digest: sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f
      pullPolicy: IfNotPresent
    model: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
    servedModelName: nemotron-ultra-550b
    tensorParallelSize: 16
    gpuCount: 8
    port: 8000
    runtimeClassName: nvidia
    existingSecret: ""
    modelTokenSecretKey: HF_TOKEN
    secrets:
      create: false
      hfToken: ""
    modelCache:
      size: 2Ti
      storageClassName: ""
    shmSize: 64Gi
    nodeSelector: {}
    tolerations: []
    distributed:
      enabled: true
      workerReplicaCount: 1
      workerGpuCount: 8
      rayPort: 6379
      dashboardPort: 8265
      expectedGpuCount: 16
    extraArgs:
      - --kv-cache-dtype=fp8
      - --max-num-seqs=16
      - --max-model-len=262144
      - --gpu-memory-utilization=0.90
      - --disable-custom-all-reduce
      - --enforce-eager
      - --max-num-batched-tokens=32768
      - --enable-expert-parallel
      - --mamba-backend=flashinfer
      - --mamba-ssm-cache-dtype=float16
      - --reasoning-parser=nemotron_v3
      - --model-loader-extra-config
      - '{"enable_multithread_load":true}'
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    resources:
      requests:
        cpu: "64"
        memory: 512Gi
      limits:
        cpu: "128"
        memory: 1Ti
    compatibilityService:
      enabled: false
      namespace: mosaic
      name: vllm-nemotron
      externalName: ""

researchAgent:
  registryCredentials:
    create: false
  iraop:
    enabled: true
    replicaCount: 1
    image:
      repository: nvcr.io/0948643769302270/iraop
      tag: c92b8f34-20260514211602
      pullPolicy: IfNotPresent
    service:
      port: 8000
    secretName: iraop-secrets
    config:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      NVIDIA_CHAT_BASE_URL: http://llm-openai-compat:8000/v1
      NVIDIA_CHAT_MODEL: nemotron-ultra-550b
      NVIDIA_API_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_EMBEDDING_MODEL: nvidia/llama-nemotron-embed-vl-1b-v2
      EMBEDDING_DIMENSION: "2048"
      MAX_TOKENS: "2048"
      DEFAULT_DEPTH: deep
      CORPUS_DIR: /cm/shared/iraop-corpus
    corpus:
      hostPath: /cm/shared/iraop-corpus
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 8Gi
  opensearch:
    enabled: true
    requiredNodeHostname: ""
    image:
      repository: opensearchproject/opensearch
      tag: "2.17.0"
      pullPolicy: IfNotPresent
    pvc:
      size: 20Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    javaOpts: -Xms2g -Xmx2g
    service:
      port: 9200
  opensearchInit:
    enabled: true
    image:
      repository: python
      tag: 3.12-slim
      pullPolicy: IfNotPresent
    backoffLimit: 5

mosaicUi:
  enabled: true
  replicaCount: 1
  image:
    repository: nvcr.io/0948643769302270/mosaic-ui
    tag: 99d3ed66
    pullPolicy: Always
  deploymentVersion: v0.0.1
  auditPvc:
    size: 1Gi
    storageClassName: ""
  service:
    port: 3000
