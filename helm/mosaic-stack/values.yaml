    name: llm-openai-compat
    port: 8000
  external:
    baseUrl: ""
    model: ""
    existingSecret: ""
    apiKeySecretKey: apiKey
    caCertificateSecret: ""
    caCertificateKey: ca.crt
  vllm:
    profile: super-1gpu
    name: vllm-nemotron
    replicaCount: 1
    image:
      repository: vllm/vllm-openai
      digest: sha256:cb9bc64f0f038c2c2ebf13b31248fb87aca40c356c3d20f363be087cfcff1fcd
      pullPolicy: IfNotPresent
    model: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    servedModelName: nemotron-3.5-super-vl
    tensorParallelSize: 1
    gpuCount: 1
    port: 8000
    runtimeClassName: nvidia
    existingSecret: ""
    modelTokenSecretKey: HF_TOKEN
    secrets:
      create: false
      hfToken: ""
    modelCache:
      size: 500Gi
      storageClassName: ""
    shmSize: 64Gi
    nodeSelector: {}
    tolerations: []
    extraArgs:
      - --revision=8a115b9d966adce8c059a7bcf47f49a1e57957d8
      - --reasoning-parser=nemotron_v3
