openclaw:
  enabled: true
  # Additional gateway environment variables, including Secret references for providers.
  extraEnv: []
  # OpenClaw provider definitions keyed by provider ID; llm is reserved for the primary provider.
  additionalModelProviders: {}
  # Skill instructions included in every session, without a separate file read.
  bootstrapSkills: []
  gatewayProtocol: 4
  cron:
    enabled: false
  slack:
    enabled: false
    maxConcurrent: 8
    session:
      dmScope: per-channel-peer
    diagnostics:
      stuckSessionWarnMs: 60000
      stuckSessionAbortMs: 150000
    existingSecret: ""
    botTokenKey: SLACK_BOT_TOKEN
    appTokenKey: SLACK_APP_TOKEN
    allowedUserIds: []
    editUserIds: []
    channelMentionsEnabled: false
    groupDmsEnabled: false
    queueMode: followup
    replyToModeByChatType:
      direct: "off"
      group: "off"
      channel: "off"
    streaming:
      mode: partial
      nativeTransport: true
    pluginVersion: 2026.6.6
  feishu:
    enabled: false
    pluginVersion: 2026.6.10
    # npm integrity of the @openclaw/feishu tarball for pluginVersion. The plugin is
    # installed by npm spec, which OpenClaw trusts as the official package, and the
    # pod does not start unless npm's recorded integrity matches this value.
    pluginIntegrity: sha512-9kTlp3KynPbiQ4OBst4TW+zFE4rTOlRxwfslTWJ4/jhueHAHoVtPEwEheIEijdT9tO9fESOHMUxPMsAaOgiagw==
    # API domain: feishu (Feishu) or lark (Lark international).
    domain: feishu
    existingSecret: ""
    appIdKey: FEISHU_APP_ID
    appSecretKey: FEISHU_APP_SECRET
    # Feishu open_id (ou_...) or user_id values permitted to message the bot.
    allowedUserIds: []
    # Group chat IDs (oc_...) where allowed users can @mention the bot.
    # Group messages are disabled while this list is empty.
    groupChatIds: []
    streaming: true
    # Show sender display names to the agent. Requires the contact:contact.base:readonly
    # scope, with senders inside the app's contact data range.
    resolveSenderNames: true
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: 2026.6.10
    pullPolicy: IfNotPresent
  opensshInstallerImage: alpine/git@sha256:e043be20669db13cbcfb6190192babee4cf2dca98709bb0c2d08ca2d35a0a06a
  pvc:
    size: 10Gi
    storageClassName: ""
  secrets:
    create: true
    name: openclaw-secrets
    gatewayToken: ""
  openshell:
    command: /tools/openshell
    gateway: ""
    gatewayEndpoint: ""
    policy: ""
    cliVersion: v0.0.75
    cliSha256:
      amd64: 9b9331644d0b6350030c521047490314b594591547b4ca28ef105b7adad73eb8
      arm64: c7bf758ed864ef375ba3358d39b4d6e4b80da9e451b67a47ae1341df82c362e0
    pluginVersion: 2026.6.6
    pluginSha256: 1e0cbbcf105e931b6dc19c9411de73dcf65e76a111e3f41ffde379e8855caa33
  service:
    port: 18789

openshell:
