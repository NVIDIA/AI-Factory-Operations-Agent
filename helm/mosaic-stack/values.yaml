        memory: 64Gi
      limits:
        cpu: "16"
        memory: 128Gi
    compatibilityService:
      enabled: false
      namespace: mosaic
      name: vllm-nemotron
      externalName: ""

researchAgent:
  registryCredentials:
    create: false
  iraop:
    enabled: true
    replicaCount: 1
    image:
      repository: nvcr.io/0948643769302270/afoa-release/iraop
      tag: f804535b
      pullPolicy: IfNotPresent
    service:
      port: 8000
    secretName: iraop-secrets
    config:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      NVIDIA_CHAT_BASE_URL: http://llm-openai-compat:8000/v1
      NVIDIA_CHAT_MODEL: nemotron-ultra-550b
      NVIDIA_API_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_EMBEDDING_MODEL: nvidia/llama-nemotron-embed-vl-1b-v2
      EMBEDDING_DIMENSION: "2048"
      MAX_TOKENS: "2048"
      DEFAULT_DEPTH: deep
      CORPUS_DIR: /cm/shared/iraop-corpus
    corpus:
      hostPath: /cm/shared/iraop-corpus
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 8Gi
  opensearch:
    enabled: true
    requiredNodeHostname: ""
    image:
      repository: opensearchproject/opensearch
      tag: "2.17.0"
      pullPolicy: IfNotPresent
    pvc:
      size: 20Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    javaOpts: -Xms2g -Xmx2g
    service:
      port: 9200
  opensearchInit:
    enabled: true
    backoffLimit: 5

mosaicUi:
