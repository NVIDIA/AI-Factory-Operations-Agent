global:
  imagePullSecrets: []
  registryCredentials:
    create: false
    name: nvcr-image-pull-secret
    server: nvcr.io
    username: "$oauthtoken"
    password: ""
    email: unused@example.com
  nodeSelector: {}
  tolerations: []

namespace:
  labels: {}

observability:
  # Prometheus-compatible query URL; VictoriaMetrics cluster URLs include /select/<tenant>/prometheus.
  prometheusUrl: http://kube-prometheus-stack-prometheus.prometheus.svc.cluster.local:9090
  grafanaUrl: http://kube-prometheus-stack-grafana.prometheus.svc.cluster.local/grafana
  alertmanagerUrl: http://kube-prometheus-stack-alertmanager.prometheus.svc.cluster.local:9093
  grafanaDatasourceUid: prometheus
  grafanaDatasourceType: prometheus
  loki:
    url: ""
    tenantId: ""
    auth:
      existingSecret: ""
      authorizationKey: authorization
  grafanaAuth:
    existingSecret: ""
    usernameKey: username
    passwordKey: password

agentSandbox:
  install: true

modules:
  ui:
    enabled: true
  execution:
    enabled: true
  kubernetes:
    enabled: true
  observability:
    enabled: true
  grafana:
    enabled: true
  bcm:
    enabled: true
  slurm:
    enabled: true
    backend: auto
    evidenceCollector:
      enabled: true
  diagnostics:
    enabled: false
  research:
    enabled: false
    timeoutMs: 240000
    secrets:
      create: false
      nvidiaApiKey: ""
      chatApiKey: EMPTY
  terminal:
    enabled: false
  webSearch:
    # DuckDuckGo needs no key; set false for air-gapped installs.
    enabled: true
    # duckduckgo or brave
    provider: duckduckgo
    maxResults: 5
    # Secret holding the API key under apiKeySecretKey; required for brave.
    existingSecret: ""
    apiKeySecretKey: WEB_SEARCH_KEY
    brave:
      # OpenClaw 2026.6.10 does not bundle Brave; install the matching official plugin.
      pluginVersion: 2026.6.10
      pluginSha256: e922a777c4b1bce6c905c47f328ea8c2b3c3ca7bc86b6f736cf52d5fdfc46b75
  clusters:
    enabled: false
  edit:
    enabled: false
    hitl: true
    approvalTimeoutMs: 120000
    kubernetes:
      enabled: true
      existingClusterRole: ""
    bcm:
      enabled: false
    ssh:
      enabled: false
      existingSecret: ""
      privateKeyKey: privateKey
      knownHostsKey: knownHosts
      timeoutMs: 60000
      maxOutputBytes: 65536
      hosts: []

kubernetes:
  defaultCluster: local
  local:
