global:
  imagePullSecrets: []
  nodeSelector: {}
  alertmanagerNamespace: prometheus

namespace:
  labels: {}

observability:
  prometheusUrl: http://prometheus.mosaic-observability.svc.cluster.local:9090
  grafanaUrl: http://grafana.mosaic-observability.svc.cluster.local:3000
  grafanaUpstreamPrefix: /api/grafana/proxy

agentSandbox:
  install: true

modules:
  ui:
    enabled: true
  execution:
    enabled: true
  kubernetes:
    enabled: true
  observability:
    enabled: true
  grafana:
    enabled: true
  bcm:
    enabled: true
  slurm:
    enabled: true
    backend: vanilla
    evidenceCollector:
      enabled: true
  diagnostics:
    enabled: false
  research:
    enabled: false
  terminal:
    enabled: false

llm:
  mode: vllm
  external:
    baseUrl: ""
    model: ""
    existingSecret: ""
    apiKeySecretKey: apiKey
  vllm:
    profile: ultra-16gpu
    name: vllm-nemotron
    replicaCount: 1
    image:
      repository: vllm/vllm-openai
      tag: latest
      pullPolicy: IfNotPresent
    model: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
    servedModelName: nemotron-ultra-550b
    tensorParallelSize: 16
    gpuCount: 8
    port: 8000
    runtimeClassName: nvidia
    existingSecret: ""
    modelTokenSecretKey: HF_TOKEN
    secrets:
      create: false
      hfToken: ""
    modelCache:
      size: 2Ti
      storageClassName: ""
    shmSize: 64Gi
    nodeSelector: {}
    tolerations: []
    distributed:
      enabled: true
      workerReplicaCount: 1
      workerGpuCount: 8
      rayPort: 6379
      dashboardPort: 8265
      expectedGpuCount: 16
    extraArgs:
      - --kv-cache-dtype=fp8
      - --max-num-seqs=16
      - --max-model-len=262144
      - --gpu-memory-utilization=0.90
      - --disable-custom-all-reduce
      - --enforce-eager
      - --max-num-batched-tokens=32768
      - --enable-expert-parallel
      - --mamba-backend=flashinfer
      - --mamba-ssm-cache-dtype=float16
      - --reasoning-parser=nemotron_v3
      - --model-loader-extra-config
      - '{"enable_multithread_load":true}'
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    resources:
      requests:
        cpu: "64"
        memory: 512Gi
      limits:
        cpu: "128"
        memory: 1Ti
    compatibilityService:
      enabled: false
      namespace: mosaic
      name: vllm-nemotron
      externalName: ""

registryCredentials:
  create: false
  name: nvcr-image-pull-secret
  server: nvcr.io
  username: "$oauthtoken"
  password: ""
  email: unused@example.com

mosaicUi:
  enabled: true
  replicaCount: 1
  image:
    repository: nvcr.io/0948643769302270/mosaic-ui
    tag: latest
    pullPolicy: IfNotPresent
  deploymentVersion: v0.0.1
  auditPvc:
    size: 1Gi
    storageClassName: ""
  service:
    port: 3000
openclaw:
  enabled: true
  gatewayProtocol: 4
  image:
    repository: nemoclaw
    tag: latest
    pullPolicy: IfNotPresent
  kubectlInstallerImage:
    repository: registry.k8s.io/kubectl
    tag: v1.30.0
    pullPolicy: IfNotPresent
  pvc:
    size: 10Gi
    storageClassName: local-path
  secrets:
    create: true
    name: openclaw-secrets
    gatewayToken: ""
  nemoclaw:
    command: /usr/local/bin/nvidia-openshell
    gatewayEndpoint: ""
    policy: /home/node/.openclaw/policies/k8s-readonly-policy.yaml
  service:
    port: 18789

openshell:
  nameOverride: ""
  fullnameOverride: ""
  imagePullSecrets: []
  sandboxImagePullSecret:
    enabled: false
    name: ""
  image:
    repository: ghcr.io/nvidia/openshell/gateway
    tag: latest
    pullPolicy: IfNotPresent
  supervisor:
    image:
      repository: ghcr.io/nvidia/openshell/supervisor
      tag: latest
      pullPolicy: IfNotPresent
    sideloadMethod: init-container
  networkPolicy:
    enabled: false
  pkiInitJob:
    enabled: false
  server:
    dbUrl: sqlite:/tmp/openshell.db
    disableTls: true
    sshGatewayHost: ""
    sshGatewayPort: 8080
    sandboxImage: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
    sandboxImagePullPolicy: Always

slurmEvidenceCollector:
  image:
    repository: node
    tag: 20-bookworm-slim
    pullPolicy: IfNotPresent
  port: 8080
  maxFileBytes: 65536
  maxMatches: 40
  maxVisitedFiles: 50000
  nodeSelector: {}
  roots:
    - /var/log
    - /cm/shared
    - /slurm
    - /etc/slurm
    - /cm/shared/apps/slurm/etc
    - /run/log/journal
    - /var/log/journal

bcmMcp:
  enabled: false
  mode: direct
  mcpUrl: http://bcm-mcp-tools:3001/mcp
  headHost: BCM-SERV-01
  authTokenSecretName: ""
  authTokenSecretKey: BCM_MCP_TOKEN
  hostSshKeySecretName: ""
  service:
    name: bcm-mcp-tools
    port: 3001
  image:
    repository: bcm-mcp-tools
    tag: latest
    pullPolicy: IfNotPresent
  busyboxImage:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  config:
    execTimeout: "120"
    maxOutputLines: "200"
    maxOutputChars: "20000"
    preloadedModules: "auto"
    noCmshUser: false
    cmshUsername: aichatbotuser
    cmshProfile: readonly
    cmshSetupTimeout: "240"
    cmshExecTimeout: "120"
    cmshPath: /cm/local/apps/cmd/bin/cmsh
    installServer: auto
    remoteCommand: bcm-support-mcp --stdio --no-cmsh-user
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mosaicTerminal:
  enabled: true
  image:
    repository: node
    tag: 20-bookworm
    pullPolicy: IfNotPresent
  kubectlInstallerImage:
    repository: bitnami/kubectl
    tag: latest
    pullPolicy: IfNotPresent
  busyboxImage:
    repository: busybox
    tag: "1.37"
    pullPolicy: IfNotPresent

diagnosticAgent:
  enabled: true
  image:
    repository: diagnostic-agent
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  hostSshKeySecretName: bcm-host-ssh-key
  playbooksConfigMapName: debughub-playbooks-tar
  bcmWebhookSecretName: bcm-webhook-creds
  config:
    nvdebugTimeoutSeconds: "1800"
    bcmWebhookTimeoutSeconds: "60"
    inferenceBackend: nvidia_api
    inferenceApiKey: dummy
    reasoningRequireFindingsMatch: "false"
    mosaicAlertMinConfidence: low
    nvdebugSpreadsheetPath: /opt/nvdebug-release/config/Telemetry_Catalog_v4.1.xlsx
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: "8"
      memory: 32Gi
  existingSecrets:
    - diagnostic-agent-secrets
    - bcm-webhook-creds
    - diagnostic-agent-api-keys
  secrets:
    create: false
    apiKeys: ""
    bcmWebhookUrl: ""
    bcmWebhookToken: ""
    env: {}
    hostSshPrivateKey: ""
    playbooksTgzBase64: ""

bcmDocs:
  enabled: true
  baseUrl: https://docs.nvidia.com/base-command-manager/manuals
  version: "11"
  timeoutSeconds: "60"
  image:
    repository: python
    tag: 3.12-alpine
    pullPolicy: IfNotPresent

externalServices:
  bcmMcp:
    enabled: false
    name: bcm-mcp-tools
    externalName: bcm-mcp-tools.mosaic.svc.cluster.local
    port: 3001
