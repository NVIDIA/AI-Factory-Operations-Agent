name: Documentation Correction
description: Request a correction to existing AI Factory Operations Agent documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the affected file or section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect or unclear.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the AI Factory Operations Agent [Code of Conduct](https://github.com/NVIDIA/AI-Factory-Operations-Agent/blob/main/CODE_OF_CONDUCT.md).
          required: true
