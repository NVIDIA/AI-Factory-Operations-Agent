# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - test
  - mirror

sast:
  stage: test

github-release-mirror:
  stage: mirror
  image: alpine:3.20
  interruptible: true
  resource_group: github-release-mirror
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git openssh-client
    - test -n "$GITHUB_DEPLOY_KEY_B64"
    - install -d -m 700 "$HOME/.ssh"
    - printf '%s' "$GITHUB_DEPLOY_KEY_B64" | base64 -d > "$HOME/.ssh/id_ed25519"
    - chmod 600 "$HOME/.ssh/id_ed25519"
    - ssh-keyscan -H github.com > "$HOME/.ssh/known_hosts"
  script:
    - |
      chart_version="$(awk '$1 == "version:" { print $2; exit }' helm/mosaic-stack/Chart.yaml)"
      app_version="$(awk '$1 == "appVersion:" { gsub(/\"/, "", $2); print $2; exit }' helm/mosaic-stack/Chart.yaml)"
      test "$chart_version" = "$CI_COMMIT_TAG"
      test "$app_version" = "$CI_COMMIT_TAG"
    - git fetch origin "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"
    - git remote add github git@github.com:NVIDIA/Mosaic.git
    - git push --atomic github "$CI_COMMIT_SHA:refs/heads/main" "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"
  after_script:
    - rm -rf "$HOME/.ssh"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      when: always

include:
  - template: Security/SAST.gitlab-ci.yml
