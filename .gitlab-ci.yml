# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - test
  - publish

sast:
  stage: test

publish-helm-chart:
  stage: publish
  image:
    name: alpine/helm:3.18.4
    entrypoint: [""]
  variables:
    CHART_DIR: helm/mosaic-stack
  script:
    - test -n "$NGC_API_KEY"
    - registry="${NGC_REGISTRY:-nvcr.io/0948643769302270}"
    - base_version="$(helm show chart "$CHART_DIR" | awk '/^version:/ { print $2; exit }')"
    - printf '%s' "$NGC_API_KEY" | helm registry login "${registry%%/*}" --username '$oauthtoken' --password-stdin
    - helm dependency build "$CHART_DIR"
    - helm lint "$CHART_DIR"
    - mkdir -p dist
    - |
      publish() {
        version="$1"
        helm package "$CHART_DIR" --version "$version" --app-version "$CI_COMMIT_SHA" --destination dist
        helm push "dist/mosaic-stack-$version.tgz" "oci://$registry"
      }

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        release_version="${CI_COMMIT_TAG#v}"
        test "$base_version" = "$release_version"
        publish "$release_version"
      else
        publish "$base_version-sha.$CI_PIPELINE_IID.g$CI_COMMIT_SHORT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          major="${base_version%%.*}"
          remainder="${base_version#*.}"
          minor="${remainder%%.*}"
          patch="${base_version##*.}"
          publish "$major.$minor.$((patch + 1))-main.$CI_PIPELINE_IID.g$CI_COMMIT_SHORT_SHA"
        fi
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

include:
  - template: Security/SAST.gitlab-ci.yml
