apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosaic-slack-bridge
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-slack-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mosaic-slack-bridge}
  template:
    metadata:
      labels: {app: mosaic-slack-bridge}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 700
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bridge
          image: node:24.11.1-bookworm-slim
          command: [node, /app/bridge.mjs, /config/bridge.json]
          ports:
            - {name: http, containerPort: 8790}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - name: code
          configMap: {name: mosaic-slack-bridge-code}
        - name: config
          configMap: {name: mosaic-slack-bridge-config}
        - name: credentials
          secret:
            secretName: mosaic-slack-bridge-credentials
            defaultMode: 0440
        - name: state
          persistentVolumeClaim: {claimName: mosaic-slack-bridge}
---
apiVersion: v1
kind: Service
metadata:
  name: mosaic-slack-bridge
spec:
  selector: {app: mosaic-slack-bridge}
  ports:
    - {name: http, port: 8790, targetPort: http}
